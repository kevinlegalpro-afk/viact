<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voices of the Neighbourhood, welcome booklet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-primary:#2c2a4a;--c-accent:#c0653a;--c-bg:#f7f4ef;--c-text:#1c1b19;
  --c-on-primary:#ffffff;--c-on-accent:#ffffff;
  --c-panel:#ffffff;--c-line:rgba(0,0,0,.09);--c-soft:rgba(0,0,0,.55);
  --fh:'Fraunces',serif;--fb:'Hanken Grotesk',sans-serif;--rad:14px;
}
.dark{--c-panel:rgba(255,255,255,.04);--c-line:rgba(255,255,255,.12);--c-soft:rgba(255,255,255,.6)}
html,body{height:100%}
body{font-family:var(--fb);background:var(--c-bg);color:var(--c-text);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
a{color:var(--c-accent)}
img{max-width:100%}
.layout{display:flex;min-height:100vh}
/* SIDEBAR NAV */
.side{transition:width .25s ease,padding .25s ease,opacity .2s ease}
.layout.side-collapsed .side{width:0;min-width:0;padding-left:0;padding-right:0;opacity:0;overflow:hidden;border-right:0}
.side-toggle{position:sticky;top:50vh;align-self:flex-start;flex:0 0 16px;width:16px;height:64px;margin-top:20px;z-index:30;border:1px solid var(--c-line);border-left:0;border-radius:0 8px 8px 0;background:var(--c-panel);color:var(--c-soft);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.side-toggle:hover{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.side-toggle svg{transition:transform .25s ease}
.layout.side-collapsed .side-toggle svg{transform:rotate(180deg)}
@media(max-width:860px){.side-toggle{display:none}}
.side{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:var(--c-panel);border-right:1px solid var(--c-line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px}
.side .ttl{font-family:var(--fh);font-size:21px;font-weight:600;line-height:1.2;margin-bottom:4px}
.side .auth{font-size:12px;color:var(--c-soft);margin-bottom:18px}
.progbar{height:6px;background:var(--c-line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.progbar>i{display:block;height:100%;background:var(--c-accent);width:0;transition:width .4s;border-radius:10px}
.nav-mod{margin-bottom:8px}
.nav-mod>.m{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c-soft);padding:10px 10px 6px}
.nav-les{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--c-soft);transition:.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-les:hover{background:var(--c-bg);color:var(--c-text)}
.nav-les.active{background:var(--c-primary);color:var(--c-on-primary)}
.nav-les .dot{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex-shrink:0;display:grid;place-items:center;opacity:.5}
.nav-les.active .dot{opacity:1}
.nav-les.done .dot{background:var(--c-accent);border-color:var(--c-accent);opacity:1}
.nav-les.done .dot svg{width:10px;height:10px;color:#fff}
.nav-les.locked{opacity:.4;cursor:not-allowed}
.nav-les .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* TOPBAR variant */
.topnav{position:sticky;top:0;z-index:20;background:var(--c-panel);border-bottom:1px solid var(--c-line);padding:0 24px;display:flex;align-items:center;gap:20px;height:64px}
.topnav .ttl{font-family:var(--fh);font-size:18px;font-weight:600}
.topnav .tn-mid{flex:1;display:flex;gap:6px;overflow-x:auto}
.topnav .tn-les{padding:8px 14px;border-radius:30px;font-size:13px;font-weight:600;color:var(--c-soft);white-space:nowrap;cursor:pointer;border:none;background:none;font-family:inherit}
.topnav .tn-les.active{background:var(--c-primary);color:var(--c-on-primary)}
.topnav .tn-les.locked{opacity:.4;cursor:not-allowed}
/* MAIN (lecteur uniquement — .layout enveloppe le cours publié) */
.layout .main{flex:1;min-width:0}
.content{max-width:none;margin:0;padding:0;position:relative;z-index:1}
.sec{display:flow-root;position:relative}
.sec.has-bg{padding:44px 0;background-position:center}
.sec-in{max-width:var(--cw,720px);margin:0 auto;padding:0 28px}
.sec-in:empty{display:none}
.content>.sec:first-child .sec-in:first-child{padding-top:54px}
.content>.sec:last-child{padding-bottom:100px}
.sec>.b{margin-bottom:0}
.sec.no-pt{padding-top:0}
.sec.sec-flush{padding:0}
.sec.no-pb{padding-bottom:0}
.content>.b,.edit-content>.b{margin:0}
.content>.b>*,.edit-content>.b>*{margin:0}
.edit-content>.eb-slot{margin:0}
.eb-slot.eb-flush{border:0!important;border-radius:0!important;margin:0!important;padding:0!important}
/* Une transition chevauche ses voisins. Son bloc voisin la recouvre visuellement (voulu :
   la photo passe par-dessus), mais sa couche de clic la rendait aussi inatteignable.
   On remonte donc UNIQUEMENT la zone de clic et les outils, jamais le dessin :
   sinon le fond opaque de la transition masquerait la photo de l'espaceur. */
.eb-slot.eb-dv .eb-guard{z-index:8!important}
/* zone de clic épousant la forme : le rectangle laisse passer, seule la forme capte */
.eb-guard-shape{pointer-events:none}
.eb-guard-shape>*{pointer-events:none}
.eb-slot.eb-dv .eb-tools{z-index:14}
.eb-slot.eb-dv .eb-a11y,.eb-slot.eb-dv .eb-fb,.eb-slot.eb-dv .eb-alt{z-index:14}
.eb-slot.eb-flush>.eb-inner{padding:0!important}
.eb-hot .eb-guard,.eb-spos .eb-guard{pointer-events:none}
.eb-spos .spacer-block{cursor:grab;touch-action:none}
.eb-spos .spacer-block.spos-drag{cursor:grabbing}
.eb-hot .hot-wrap.hot-hidden .hot-pin{opacity:.6!important;animation:none}
.eb-hot .hot-pin.hot-locked{opacity:.6!important;filter:none;cursor:grab}
.hot-pin.pin-drag{cursor:grab;touch-action:none}
.hot-pin.pin-drag:hover{transform:translate(-50%,-50%) scale(1.15)}
.hot-pin.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.25);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hot-tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:13;margin:0;padding:5px 11px;border-radius:8px;background:rgba(28,27,25,.82);color:#fff;font-size:11.5px;text-align:center;font-style:normal;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.eb-slot:hover .hot-tip{opacity:1}
.eb-slot.eb-flush.sel{outline:2px solid #4f7cff;outline-offset:-2px}
.les-kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-accent);margin-bottom:10px}
.les-h1{font-family:var(--fh);font-size:clamp(28px,5vw,42px);font-weight:600;line-height:1.12;letter-spacing:-.5px;margin-bottom:34px}
.les-head-bg{padding:30px 32px;border-radius:16px;margin-bottom:30px}
.les-head-bg .les-kicker{color:inherit;opacity:.72}
.les-head-bg .les-h1{color:inherit;margin-bottom:0}
/* blocks */
.b{margin-bottom:30px;animation:rise .5s both}
.b.gated,.sec-hidden{display:none}
.b-instr{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;padding:0;background:none;border:0;border-radius:0;font-family:var(--fb);font-size:13.5px;line-height:1.5;color:inherit;opacity:.85;font-style:normal;font-weight:400;text-align:left}
.bi-ic{font-size:15px;line-height:1.4;flex-shrink:0;font-style:normal}
.bi-tx{flex:1}
.b-instr+*{margin-top:0}
@media(max-width:640px){.b-instr{font-size:13px}}
.cont-wrap{padding:6px 0}
.b.cont-used .cont-btn{opacity:.45;pointer-events:none}
.pw-card{display:inline-block;max-width:520px;width:100%;text-align:left;border:1px solid var(--c-line);border-radius:14px;padding:22px 24px;background:var(--c-panel,rgba(0,0,0,.02))}
.pw-card.pw-ok{border-color:var(--c-ok,#3a9d5a)}
.pw-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c-accent);color:#fff;margin-bottom:12px}
.pw-card.pw-ok .pw-ic{background:var(--c-ok,#3a9d5a)}
.pw-prompt{margin:0 0 14px;line-height:1.55}
.pw-row{display:flex;gap:9px;flex-wrap:wrap}
.pw-inp{flex:1;min-width:150px;padding:11px 13px;border:1px solid var(--c-line);border-radius:9px;font-size:15px;background:var(--c-bg);color:var(--c-text)}
.pw-inp:focus{outline:2px solid var(--c-accent);outline-offset:1px}
.pw-btn{flex:none}
.pw-hint{margin:10px 0 0;font-size:13px;color:var(--c-soft)}
.pw-msg{margin:10px 0 0;font-size:14px;min-height:1px}
.pw-good{color:var(--c-ok,#3a9d5a);font-weight:600}
.pw-bad{color:var(--c-danger,#c0392b);font-weight:600}
.pw-shake{animation:pwShake .38s}
@keyframes pwShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.pw-shake{animation:none}}
.b.cont-used .cont-btn svg{transform:rotate(180deg)}
.b.rv{animation:none;opacity:0}
.b.rv-fade{transition:opacity var(--rvs,.55s) ease}
.b.rv-up{transform:translateY(26px);transition:opacity var(--rvs,.55s) ease,transform var(--rvs,.55s) cubic-bezier(.22,.61,.36,1)}
.b.rv-zoom{transform:scale(.965);transition:opacity var(--rvs,.55s) ease,transform var(--rvs,.55s) cubic-bezier(.22,.61,.36,1)}
.b.rv-blur{filter:blur(7px);transition:opacity var(--rvs,.55s) ease,filter var(--rvs,.55s) ease}
.b.rv.rv-in{opacity:1;transform:none;filter:none}
@media(prefers-reduced-motion:reduce){.b.rv{opacity:1;transform:none;filter:none;transition:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.b.locked{filter:blur(5px);opacity:.4;pointer-events:none;user-select:none}
.bh{font-family:var(--fh);font-weight:600;line-height:1.2}
.bh1{font-size:30px}.bh2{font-size:24px}.bh3{font-size:19px}
.tg{display:flex;flex-direction:column}
.tg>.tg-h1{margin:0 0 8px}
.tg>.tg-h2{margin:0 0 6px}
.tg>.tg-h1+.tg-h2{margin-top:-2px}
.tg>.tg-body{margin:0}
.bp{font-size:16.5px;line-height:1.7}
.glossary-term{font:inherit;color:inherit;background:transparent;border:none;padding:0;cursor:help;border-bottom:2px dotted var(--c-accent);border-radius:2px;transition:background .15s}
.glossary-term:hover,.glossary-term[aria-expanded="true"]{background:color-mix(in srgb,var(--c-accent) 14%,transparent)}
.glossary-term:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.glossary-tip{position:absolute;z-index:9999;background-color:var(--c-bg,#fff);background-image:linear-gradient(var(--c-panel,#fff),var(--c-panel,#fff));color:var(--c-text,#1c1b19);border:1px solid var(--c-line,#e3ded6);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:14px 16px;font-size:14px;line-height:1.5;animation:gtIn .14s ease}
.glossary-tip .gt-term{display:block;font-weight:700;font-family:var(--fh);margin-bottom:4px;color:var(--c-primary)}
.glossary-tip .gt-def{display:block}
@keyframes gtIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gloss-bar{margin-top:auto;padding-top:14px;border-top:1px solid var(--c-line)}
.gloss-details{margin-top:8px}
.gloss-details summary{list-style:none}
.gloss-details summary::-webkit-details-marker{display:none}
.gloss-details .gloss-panel-list{margin-top:8px;max-height:40vh;overflow-y:auto}
.gloss-details[open] .gloss-link svg{color:var(--c-primary)}
.gloss-link{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:var(--c-soft);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.gloss-link:hover{color:var(--c-primary)}
.gloss-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-soft);margin-top:6px;cursor:pointer}
.gloss-toggle input{cursor:pointer}
.gloss-search{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:8px 12px;border:1px solid var(--c-line);border-radius:20px;background:var(--c-panel,#fff);color:var(--c-ink,#1c1b19);font:inherit;font-size:13px}
.gloss-search:focus{outline:none;border-color:var(--c-primary)}
.gpl-empty{color:var(--c-soft);font-size:13px;font-style:italic}
.gloss-panel-list{list-style:none;padding:0;margin:0}
.gloss-panel-list li{padding:12px 0;border-bottom:1px solid var(--c-line)}
.gloss-panel-list .gpl-term{font-weight:700;font-family:var(--fh);color:var(--c-primary);margin-bottom:3px}
.bpull-wrap::after{content:"";display:block;clear:both}
.bpull{font-family:var(--fh);font-size:22px;line-height:1.4;font-weight:600;color:var(--c-primary);padding:14px 20px;margin:6px 0 14px;border-top:3px solid var(--c-accent);border-bottom:3px solid var(--c-accent);max-width:46%}
.bpull-right{float:right;margin-left:28px;text-align:right}
.bpull-left{float:left;margin-right:28px;text-align:left}
@media(max-width:640px){.bpull{float:none;max-width:none;margin:12px 0;text-align:left}}
.bmeta{display:flex;align-items:center;gap:18px;margin:8px 0}
.bmeta-ico{flex:0 0 auto;font-size:40px;line-height:1;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c-accent) 12%,transparent);border-radius:14px}
.bmeta-tx{flex:1;line-height:1.6}
@media(max-width:640px){.bmeta{gap:12px}.bmeta-ico{font-size:32px;width:46px;height:46px}}
.bcols3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.bcols3>div{line-height:1.6}
@media(max-width:720px){.bcols3{grid-template-columns:1fr;gap:16px}}
.swipe-block{max-width:460px;margin:10px auto}
.swipe-prompt{text-align:center;margin:0 0 12px;color:var(--c-ink-soft,var(--c-soft))}
.swipe-legend{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:14px}
.swipe-legend .sl-left{color:#c0392b}.swipe-legend .sl-right{color:#2f9c56}
.swipe-stage{position:relative;height:260px;margin-bottom:8px}
.swipe-stage.is-done{height:auto;min-height:180px}
.swipe-done .sd-kept{max-height:340px;overflow-y:auto}
.drawer-panel .gloss-bar{margin-top:18px}
.swipe-card{position:absolute;inset:0;background:var(--c-panel,#fff);border:1px solid var(--c-line,#e3ded6);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;transition:transform .3s ease,opacity .3s ease;user-select:none}
.swipe-card.is-behind{background:var(--c-panel,#fff);filter:brightness(.985)}
.swipe-card.is-top{cursor:grab}
.swipe-card.is-top:active{cursor:grabbing}
.sc-text{font-size:19px;line-height:1.5;font-family:var(--fh)}
.sc-stamp{position:absolute;top:18px;font-size:15px;font-weight:800;letter-spacing:.5px;padding:6px 14px;border-radius:8px;border:3px solid;text-transform:uppercase;opacity:0;transition:opacity .1s;pointer-events:none}
.stamp-no{left:18px;color:#c0392b;border-color:#c0392b;transform:rotate(-14deg)}
.stamp-yes{right:18px;color:#2f9c56;border-color:#2f9c56;transform:rotate(14deg)}
.swipe-controls{display:flex;justify-content:center;gap:22px;margin:6px 0}
.swipe-btn{width:60px;height:60px;border-radius:50%;border:2px solid var(--c-line);background:var(--c-panel,#fff);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.swipe-btn:hover{transform:scale(1.08)}
.swipe-btn.no{color:#c0392b}.swipe-btn.no:hover{background:#fdece9;border-color:#c0392b}
.swipe-btn.yes{color:#2f9c56}.swipe-btn.yes:hover{background:#eaf6ee;border-color:#2f9c56}
.swipe-feedback{text-align:center;min-height:24px;font-weight:700;font-size:15px}
.swipe-feedback.ok{color:#2f9c56}.swipe-feedback.bad{color:#c0392b}
.swipe-progress{text-align:center;font-size:12.5px;color:var(--c-soft);margin-top:4px}
.swipe-done{text-align:center;padding:20px}
.swipe-done .sd-ico{font-size:44px;color:#2f9c56;line-height:1}
.swipe-done .sd-txt{font-weight:700;font-size:17px;margin:8px 0 4px;font-family:var(--fh)}
.swipe-done .sd-kept{list-style:none;padding:0;margin:12px 0;text-align:left}
.swipe-done .sd-kept li{padding:9px 14px;background:var(--c-paper,rgba(0,0,0,.04));border-radius:10px;margin-bottom:7px;border-left:3px solid #2f9c56}
.swipe-done .sd-empty{color:var(--c-soft)}
.swipe-again{margin-top:14px;padding:9px 20px;border-radius:30px;border:1px solid var(--c-primary);background:transparent;color:var(--c-primary);font:inherit;font-weight:600;cursor:pointer}
.swipe-again:hover{background:var(--c-primary);color:var(--c-on-primary)}
.swipe-empty{text-align:center;color:var(--c-soft);padding:20px}
.ivideo{position:relative;margin:8px 0}
.ivideo-stage{position:relative;background:#000;border-radius:var(--rad);overflow:hidden}
.ivideo-el{display:block;width:100%;border-radius:var(--rad)}
.ivideo-yt,.ivideo-ytwrap{position:relative;width:100%;aspect-ratio:16/9}
.ivideo-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ivideo-cap{font-size:14px;color:var(--c-soft);margin-top:8px;text-align:center}
.ivideo-warn{font-size:13px;color:#c9821a;background:#fdf4e7;border:1px solid #f2e0bf;border-radius:10px;padding:9px 12px;margin-top:8px}
.ivideo-overlay{position:absolute;inset:0;background:rgba(20,18,30,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;border-radius:var(--rad);backdrop-filter:blur(2px)}
.ivo-card{background:var(--c-panel,#fff);color:var(--c-ink,#1c1b19);border-radius:18px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:90%;overflow-y:auto;animation:gtIn .18s ease}
.ivo-q{font-family:var(--fh);font-size:19px;font-weight:600;margin-bottom:16px;line-height:1.4}
.ivo-opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:9px;border:1.5px solid var(--c-line);border-radius:12px;background:transparent;color:inherit;font:inherit;cursor:pointer;transition:.15s}
.ivo-opt:hover{border-color:var(--c-primary);background:color-mix(in srgb,var(--c-primary) 6%,transparent)}
.ivo-opt.good{border-color:#2f9c56;background:#eaf6ee;color:#1f5133;font-weight:600}
.ivo-opt.bad{border-color:#c0392b;background:#fdece9;color:#8a2a20}
.ivo-fb{min-height:22px;font-weight:700;text-align:center;margin-top:6px}
.ivo-fb.ok{color:#2f9c56}.ivo-fb.bad{color:#c0392b}
.ivo-ta{width:100%;min-height:110px;padding:12px;border:1.5px solid var(--c-line);border-radius:12px;font:inherit;resize:vertical;background:var(--c-paper,#fff);color:inherit}
.ivo-cont,.ivo-card .ivo-cont{margin-top:14px;padding:11px 24px;border-radius:30px;border:none;background:var(--c-primary);color:var(--c-on-primary);font:inherit;font-weight:600;cursor:pointer;display:block;margin-left:auto}
.ivideo-empty{text-align:center;color:var(--c-soft);padding:24px;border:1px dashed var(--c-line);border-radius:var(--rad)}
.model-block{margin:10px 0;text-align:center}
.model-title{font-family:var(--fh);font-size:19px;font-weight:600;margin-bottom:14px}
.model-stage{display:flex;justify-content:center}
.model-svg{width:100%;max-width:440px;height:auto;overflow:visible}
.mdl-hit{transition:opacity .15s,transform .15s;transform-origin:center;transform-box:fill-box}
.mdl-hit:hover{opacity:.86}
.mdl-hit.mdl-active{filter:drop-shadow(0 3px 8px rgba(0,0,0,.28))}
.mdl-hit:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px}

.bquote{border-left:4px solid var(--c-accent);padding:6px 0 6px 22px;font-family:var(--fh);font-style:italic;font-size:21px;line-height:1.5}

.card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad);overflow:hidden}
/* accordion */
.ie-intro{margin:0 0 8px;color:var(--c-ink-soft,var(--c-soft))}
.ie-wrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start;line-height:1.7}
.ie-item{display:inline}
.ie-term{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:30px;border:1px solid var(--c-primary);background:transparent;color:var(--c-primary);font:inherit;font-weight:600;font-size:.94em;cursor:pointer;transition:.18s}

.ie-body[hidden]{display:none}
.acc-item{border:1px solid var(--c-line);border-radius:var(--rad);margin-bottom:10px;overflow:hidden;background:var(--c-panel)}
.acc-head{padding:16px 18px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:12px}

.acc-body{max-height:0;overflow:hidden;transition:.3s;padding:0 18px}
.acc-item.open .acc-body{max-height:1000px;padding:0 18px 18px}
/* tabs */
.tabs-head{display:flex;gap:4px;border-bottom:1px solid var(--c-line);margin-bottom:18px;overflow-x:auto}
.tab-btn{padding:12px 18px;font-weight:700;font-size:14px;color:var(--c-soft);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;margin-bottom:-1px}

.tabs-wrap.framed .tabs-body{background:var(--c-panel);border:1px solid var(--c-line);border-radius:0 var(--rad) var(--rad) var(--rad);padding:22px}
.tabs-wrap.framed .tabs-head{border-bottom:0;gap:2px}
.tabs-wrap.framed .tab-btn{border:1px solid transparent;border-bottom:0;border-radius:var(--rad) var(--rad) 0 0;margin-bottom:-1px}
.tabs-wrap.framed .tab-btn.active{background:var(--c-panel);border-color:var(--c-line);color:var(--c-primary)}
/* flashcards */
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--fcw,200px),1fr));gap:14px}
.flash-grid.fc-s{--fcw:150px}
.flash-grid.fc-m{--fcw:200px}
.flash-grid.fc-l{--fcw:270px}
.flash-grid.fc-xl{--fcw:340px}
.flash-grid.fc-s .flash{min-height:130px}
.flash-grid.fc-l .flash{min-height:210px}
.flash-grid.fc-xl .flash{min-height:260px}

.flash-grid.fc-center.fc-l .flash{flex:0 0 270px;max-width:270px}

.flash{height:180px;perspective:1200px;cursor:pointer}

/* timeline */
.tl{position:relative}
.tl-left{padding-left:36px}
.tl-left::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--c-line)}
.tl-left .tl-item{position:relative;margin-bottom:26px}
.tl-left .tl-dot{position:absolute;left:-25px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 0 4px var(--c-bg)}
.tl-right{padding-right:36px;text-align:right}
.tl-right::before{content:'';position:absolute;right:11px;top:6px;bottom:6px;width:2px;background:var(--c-line)}
.tl-right .tl-item{position:relative;margin-bottom:26px}
.tl-right .tl-dot{position:absolute;right:-25px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 0 4px var(--c-bg)}
.tl-center{padding:0}

.tl-center .tl-item{position:relative;width:50%;margin-bottom:26px;box-sizing:border-box}
.tl-center .tl-item:nth-child(odd){left:0;padding-right:30px;text-align:right}
.tl-center .tl-item:nth-child(even){left:50%;padding-left:30px}
.tl-center .tl-dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 0 4px var(--c-bg)}
.tl-center .tl-item:nth-child(odd) .tl-dot{right:-7px}
.tl-center .tl-item:nth-child(even) .tl-dot{left:-7px}
.tl-item{display:flex;gap:14px;align-items:flex-start}
.tl-card{flex:1 1 auto;min-width:0;order:1}

.lb-ov{position:fixed;inset:0;z-index:200;background:rgba(14,13,12,.93);display:flex;align-items:center;justify-content:center;padding:40px 20px;animation:lbin .2s ease}

.lb-x{top:18px;right:18px;width:40px;height:40px;font-size:17px}

/* ===== Association (glisser-déposer) ===== */
.mt-wrap{margin-top:6px}
.mt-pool{margin-bottom:18px;padding:12px;border:2px dashed var(--c-line);border-radius:var(--rad);transition:border-color .15s,background .15s}
.mt-pool.over{border-color:var(--c-accent);background:rgba(125,125,125,.06)}
.mt-pool.shake{animation:mtsh .45s}
@keyframes mtsh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.mt-pool-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--c-soft);margin-bottom:9px}
.mt-n{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:var(--c-line);color:var(--c-text);text-align:center}
.mt-src{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.mt-rows{display:flex;flex-direction:column;gap:10px}
.mt-row{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:0}
.mt-left{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:10px 0 0 10px;background:var(--c-panel);border:1px solid var(--c-line);border-right:0;font-size:14px;line-height:1.4;min-height:52px}
.mt-num{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--c-accent);color:var(--c-on-accent);font-size:11px;font-weight:800;display:grid;place-items:center}
.mt-link{height:2px;background:repeating-linear-gradient(90deg,var(--c-line) 0 4px,transparent 4px 8px)}
.mt-slot{border-radius:0 10px 10px 0;border:1px dashed var(--c-line);border-left:0;background:rgba(125,125,125,.05);min-height:52px;display:flex;align-items:center;padding:7px;transition:background .15s,border-color .15s}
.mt-slot.over{border-color:var(--c-accent);background:rgba(125,125,125,.12)}
.mt-slot .mt-drop{width:100%;display:flex;align-items:center;min-height:38px}
.mt-slot .mt-drop:empty::after{content:'Déposez ici';font-size:11.5px;color:var(--c-soft);font-style:italic;padding-left:6px}
.mt-tag{display:inline-flex;align-items:center;padding:9px 13px;border-radius:8px;background:var(--c-bg);border:1px solid var(--c-line);box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13.5px;line-height:1.35;cursor:grab;user-select:none;transition:box-shadow .15s,transform .12s,border-color .15s}
.mt-tag:hover{box-shadow:0 4px 12px rgba(0,0,0,.13);transform:translateY(-1px)}
.mt-tag:active{cursor:grabbing}
.mt-tag:focus-visible{outline:3px solid var(--c-accent);outline-offset:2px}
.mt-tag.sel{border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent)}
.mt-tag.drag{opacity:.45}
.mt-slot .mt-tag{width:100%}
.mt-tag.ok{border-color:#2e7d5b;background:rgba(46,125,91,.10)}
.mt-tag.no{border-color:#b3423a;background:rgba(179,66,58,.10)}
.mt-tag.ok::after{content:'✓';margin-left:auto;color:#2e7d5b;font-weight:800;padding-left:8px}
.mt-tag.no::after{content:'✕';margin-left:auto;color:#b3423a;font-weight:800;padding-left:8px}
@media(max-width:620px){
  .mt-row{grid-template-columns:1fr}
  .mt-left{border-radius:10px 10px 0 0;border-right:1px solid var(--c-line);border-bottom:0}
  .mt-link{display:none}
  .mt-slot{border-radius:0 0 10px 10px;border-left:1px dashed var(--c-line);border-top:0}
}
/* ===== Tri par catégories ===== */

.so-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.13);transform:translateY(-1px)}

/* ===== Roue aléatoire ===== */
.wh-block{text-align:center}
.wh-prompt{font-family:var(--fh);font-size:17px;font-weight:600;margin-bottom:16px}
.wh-stage{position:relative;margin:0 auto;aspect-ratio:1/1;width:100%}
.wh-disc{width:100%;height:100%;filter:drop-shadow(0 10px 26px rgba(0,0,0,.22));will-change:transform}
.wh-disc svg{width:100%;height:100%;display:block}
.wh-needle{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:24px solid var(--c-text);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.wh-needle::after{content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--c-text)}
.wh-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:27%;height:27%;border-radius:50%;border:4px solid var(--c-panel);background:var(--c-text);color:var(--c-bg);font-family:var(--fb);font-weight:800;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 5px 18px rgba(0,0,0,.3);transition:transform .18s,filter .18s}
.wh-hub span{font-size:clamp(10px,2.6vw,13px);line-height:1.15;padding:0 4px}
.wh-hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.06)}
.wh-hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.96)}
.wh-hub.spinning{filter:grayscale(.4);cursor:default}
.wh-hub.done{opacity:.55;cursor:default}
.wh-res{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .4s ease,margin .4s}

.wh-rb{font-size:14.5px;line-height:1.6}
@media(prefers-reduced-motion:reduce){.wh-disc{transition:none!important}}

.anim-spin{animation:an-spin 6s linear infinite}
.anim-shake{animation:an-shake 3s ease infinite}
.anim-wobble{animation:an-wobble 3s ease-in-out infinite}
.anim-tada{animation:an-tada 3s ease infinite}
@media(prefers-reduced-motion:reduce){[class*=anim-]{animation:none!important}}
.img-medium{max-width:480px;margin:0 auto}.img-medium img{width:100%;border-radius:var(--rad)}
.img-small{max-width:280px}.img-small img{width:100%;border-radius:var(--rad)}
.gal{display:grid;gap:10px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:10px;aspect-ratio:1;cursor:pointer}
.vid-wrap{position:relative;border-radius:var(--rad);overflow:hidden;background:#000;aspect-ratio:16/9}
.vid-wrap iframe,.vid-wrap video{position:absolute;inset:0;width:100%;height:100%;border:none}
.audio-card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad);padding:16px 18px}
.aud-main{display:flex;align-items:center;gap:15px;min-width:0}
.aud-play{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:none;background:var(--c-primary);color:var(--c-on-primary);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.aud-play:hover{filter:brightness(1.08)}
.aud-body{flex:1 1 auto;min-width:0}
.aud-title{font-weight:700;margin-bottom:8px;font-family:var(--fh);line-height:1.25;overflow-wrap:anywhere}
.aud-row{display:flex;align-items:center;gap:10px;min-width:0}
.aud-seek{flex:1 1 auto;min-width:0;width:100%;accent-color:var(--c-primary);cursor:pointer;height:5px}
.aud-time{flex:0 0 auto;font-size:12px;color:var(--c-soft);font-variant-numeric:tabular-nums;min-width:76px;text-align:right;white-space:nowrap}
@media(max-width:520px){.aud-time{min-width:auto;font-size:11px}.aud-play{width:46px;height:46px}}
.attach-card{display:flex;align-items:center;gap:14px;background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad);padding:16px 18px;text-decoration:none;color:inherit;transition:.15s}
.attach-card:hover{border-color:var(--c-accent)}
.attach-card .fi{width:44px;height:44px;border-radius:11px;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center;flex-shrink:0}
.attach-card .fn{font-weight:700}.attach-card .fm{font-size:12px;color:var(--c-soft)}
/* quiz */
.quiz{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad);padding:24px}
.quiz-q{font-family:var(--fh);font-size:19px;font-weight:600;margin-bottom:4px}
.quiz-sub{font-size:12px;color:var(--c-soft);margin-bottom:16px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--c-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.13s;font-size:15px;font-weight:500}
.opt:hover{border-color:var(--c-accent)}
.opt .mark{width:22px;height:22px;border:2px solid var(--c-line);flex-shrink:0;display:grid;place-items:center;transition:.13s}
.opt[data-shape=circle] .mark{border-radius:50%}
.opt[data-shape=square] .mark{border-radius:6px}
.opt.sel{border-color:var(--c-accent)}
.opt.sel .mark{background:var(--c-accent);border-color:var(--c-accent)}
.opt.sel .mark svg{width:12px;height:12px;color:#fff}
.opt.correct{border-color:#3f7d5b;background:rgba(63,125,91,.08)}
.opt.wrong{border-color:#b34a4a;background:rgba(179,74,74,.08)}
.opt.locked{cursor:default}
.match-wrap{display:flex;flex-direction:column;gap:10px}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.match-left{padding:13px 15px;background:var(--c-bg);border:1px solid var(--c-line);border-radius:10px;font-weight:600;font-size:14px}
.match-row select{padding:12px;border:1.5px solid var(--c-line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--c-panel);color:inherit;width:100%}
.match-row .arr{color:var(--c-soft)}
.blank-text{font-size:17px;line-height:2.4}
.blank-text input{display:inline-block;width:120px;padding:6px 10px;border:none;border-bottom:2px solid var(--c-accent);background:var(--c-bg);font-family:inherit;font-size:15px;text-align:center;border-radius:6px 6px 0 0;color:inherit}
.blank-text input.ok{border-color:#3f7d5b;background:rgba(63,125,91,.1)}
.blank-text input.ko{border-color:#b34a4a;background:rgba(179,74,74,.1)}
.quiz-actions{margin-top:18px;display:flex;gap:12px;align-items:center}
.quiz-check{padding:12px 24px;background:var(--c-primary);color:var(--c-on-primary);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.quiz-check:disabled{opacity:.4;cursor:not-allowed}
.quiz-retry{padding:12px 18px;background:none;border:1.5px solid var(--c-line);border-radius:10px;font-weight:600;cursor:pointer;color:inherit;font-family:inherit;display:none}
.quiz-fb{margin-top:16px;padding:16px 18px;border-radius:11px;font-size:15px;display:none;animation:rise .3s both}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:rgba(63,125,91,.12);border-left:3px solid #3f7d5b}
.quiz-fb.no{background:rgba(179,74,74,.12);border-left:3px solid #b34a4a}
.quiz-fb b{display:block;margin-bottom:3px}
/* chart */
.chart-card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad);padding:22px}
.grid-ttl{font-family:var(--fh);font-size:17px;font-weight:600;margin-bottom:10px}
.grid-wrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--rad)}
.grid-tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:15px;background:var(--c-panel)}
.grid-tbl th,.grid-tbl td{word-wrap:break-word;overflow-wrap:anywhere;padding:11px 14px;border-bottom:1px solid var(--c-line);border-right:1px solid var(--c-line)}
.grid-tbl th:last-child,.grid-tbl td:last-child{border-right:0}
.grid-tbl tr:last-child th,.grid-tbl tr:last-child td{border-bottom:0}
.grid-tbl th{background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:13.5px;letter-spacing:.2px}
.grid-tbl td:first-child:not(:only-child){font-weight:500}
.grid-tbl.striped tr:nth-child(even) td{background:rgba(0,0,0,.035)}
.grid-tbl.compact th,.grid-tbl.compact td{padding:7px 10px;font-size:14px}
.ch-sum{margin-top:12px;font-size:14px;line-height:1.55;color:var(--c-text)}
.ch-leg{list-style:none;display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 0;padding:0}
.ch-leg li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--c-text)}
.ch-sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.ch-data{margin-top:14px}
.ch-tog{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--c-line);background:transparent;color:var(--c-text);font-family:var(--fb);font-size:12.5px;font-weight:600;cursor:pointer}
.ch-tog:hover{border-color:var(--c-accent);color:var(--c-accent)}
.ch-tog svg{transition:transform .2s}
.ch-tog.open svg{transform:rotate(180deg)}
.ch-tbl{margin-top:10px}
.ch-src{margin-top:10px;font-size:11.5px;color:var(--c-soft);font-style:italic}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.chart-card.no-frame{background:transparent;border:0;padding:0;box-shadow:none}
/* ===== Document de notes (aperçu + PDF) ===== */
.np-ov{position:fixed;inset:0;z-index:120;background:rgba(20,18,16,.55);display:flex;flex-direction:column;overscroll-behavior:contain}
.np-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--c-panel);border-bottom:1px solid var(--c-line);flex-wrap:wrap}
.np-bt{font-family:var(--fh);font-weight:600;font-size:15px}
.np-acts{display:flex;gap:8px;flex-wrap:wrap}
.np-btn{padding:9px 14px;border-radius:8px;border:1px solid var(--c-primary);background:var(--c-primary);color:var(--c-on-primary);font-family:var(--fb);font-size:13.5px;font-weight:600;cursor:pointer}
.np-btn.ghost{background:transparent;color:var(--c-text);border-color:var(--c-line)}
.np-btn:hover{opacity:.9}
.np-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:24px 16px 60px;display:flex;justify-content:center;align-items:flex-start}
.np-btn.on{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.ne-wrap{width:100%;max-width:720px}
.ne-tip{font-size:13.5px;color:var(--c-soft);line-height:1.55;background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:12px 15px;margin:0 0 16px}
.ne-card{background:var(--c-bg);border:1px solid var(--c-line);border-radius:12px;padding:12px 14px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ne-card.drag{opacity:.5}
.ne-card.ne-over{border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent) inset}
.ne-card.ne-free{border-style:dashed;border-color:var(--c-accent)}
.ne-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ne-grip{cursor:grab;color:var(--c-soft);display:flex}
.ne-grip:active{cursor:grabbing}
.ne-tag{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--c-accent);background:color-mix(in srgb,var(--c-accent) 12%,transparent);padding:2px 8px;border-radius:5px}
.ne-acts{margin-left:auto;display:flex;gap:3px}
.ne-b{width:30px;height:30px;border-radius:7px;border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);cursor:pointer;display:grid;place-items:center}
.ne-b:hover{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.ne-del:hover{background:#c0392b;border-color:#c0392b;color:#fff}
.ne-ti{width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-family:var(--fh);font-size:16px;font-weight:600;color:var(--c-text);padding:2px 0;margin-bottom:6px}
.ne-ti:focus{outline:none;border-bottom-color:var(--c-accent)}
.ne-ta{width:100%;border:1px solid var(--c-line);border-radius:8px;background:var(--c-panel);color:var(--c-text);font-family:var(--fb);font-size:14.5px;line-height:1.6;padding:9px 11px;resize:vertical;min-height:44px}
.ne-ta:focus{outline:2px solid var(--c-accent);outline-offset:0;border-color:var(--c-accent)}
.ne-src{font-size:12px;color:var(--c-soft);margin-top:7px}
.ne-svg{margin:6px 0}
.ne-note{font-size:12px;color:var(--c-soft);font-style:italic;margin:4px 0 0}
.ne-add{width:100%;max-width:720px;padding:12px;border:2px dashed var(--c-line);border-radius:12px;background:transparent;color:var(--c-accent);font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.ne-add:hover{border-color:var(--c-accent);background:color-mix(in srgb,var(--c-accent) 6%,transparent)}
.ne-ins{width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 0;opacity:.35;transition:.15s}
.ne-ins:hover{opacity:1}
.ne-ins-l{flex:1;height:1px;background:var(--c-accent)}
.ne-ins-p{width:22px;height:22px;border-radius:50%;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center;flex:none}
.ne-fmt{display:flex;gap:3px;margin-bottom:7px;flex-wrap:wrap}
.ne-fb{min-width:30px;height:30px;padding:0 7px;border:1px solid var(--c-line);border-radius:7px;background:var(--c-panel);color:var(--c-text);cursor:pointer;font-size:14px;display:grid;place-items:center}
.ne-fb:hover{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.ne-ed{width:100%;border:1px solid var(--c-line);border-radius:8px;background:var(--c-panel);color:var(--c-text);font-family:var(--fb);font-size:14.5px;line-height:1.6;padding:9px 11px;min-height:44px;outline:none}
.ne-ed:focus{outline:2px solid var(--c-accent);outline-offset:0;border-color:var(--c-accent)}
.ne-ed:empty::before{content:attr(data-ph);color:var(--c-soft)}
.ne-ed ul,.ne-ed ol{margin:4px 0;padding-left:22px}
.ne-ed mark{padding:0 2px;border-radius:2px}
.ne-snap{border:1px solid var(--c-line);border-radius:8px;padding:12px;margin:6px 0;overflow:auto;background:var(--c-bg)}
.ne-snap *{max-width:100%}
.np-snap{border:1px solid var(--c-line);border-radius:8px;padding:14px;margin:8px 0;overflow:hidden}
.np-a ul,.np-a ol{margin:4px 0;padding-left:22px}
.np-a mark{padding:0 2px;border-radius:2px}
.cap-snap{margin:0 auto}
/* modes de capture */
.cap-tool-wrap{position:fixed;right:0;top:calc(50% + 52px);z-index:60}
.cap-pop{position:absolute;right:calc(100% + 8px);top:0;display:none;flex-direction:column;gap:6px;width:210px;padding:8px;border-radius:10px;background-color:var(--c-bg);background-image:linear-gradient(var(--c-panel),var(--c-panel));border:1px solid var(--c-line);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cap-pop.show{display:flex}
.cap-m{text-align:left;border:1px solid var(--c-line);border-radius:8px;background:var(--c-bg);color:var(--c-text);cursor:pointer;padding:8px 10px}
.cap-m b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.cap-m span{display:block;font-size:11.5px;color:var(--c-soft);line-height:1.4}
.cap-m.on{border-color:var(--c-accent);background:color-mix(in srgb,var(--c-accent) 10%,transparent)}
.cap-m:hover{border-color:var(--c-accent)}
@media print{.np-bar{display:none}.ne-wrap,.ne-add,.ne-ins,.ne-fmt{display:none}}
.np-page{width:100%;max-width:760px;flex:0 0 auto;background:#fff;color:#1c1b19;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:46px 48px 60px;font-family:var(--fb)}
.np-head{border-bottom:3px solid var(--c-accent);padding-bottom:18px;margin-bottom:26px}
.np-logo{max-height:44px;max-width:150px;object-fit:contain;margin-bottom:14px;display:block}
.np-kick{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--c-accent);margin-bottom:5px}
.np-page h1{font-family:var(--fh);font-size:28px;font-weight:600;color:var(--c-primary);margin-bottom:6px;line-height:1.2}
.np-meta{font-size:12.5px;color:#6b675f}
.np-sec{margin-bottom:30px;break-inside:auto}
.np-sec h2{font-family:var(--fh);font-size:17px;font-weight:600;color:var(--c-primary);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #e6e1d8}
.np-item{margin-bottom:18px;padding-left:12px;border-left:3px solid var(--c-accent);break-inside:avoid}
.np-q{font-weight:700;font-size:14px;margin-bottom:5px}
.np-a{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.np-a.np-none{color:#9a958c;font-style:italic}
.np-src{font-size:11px;color:#9a958c;margin-top:5px}
.np-pits{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.np-pit{padding:6px 10px;border-radius:6px;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.np-map{margin-top:6px;padding:12px;background:#fdfcfa;border:1px solid #e6e1d8;border-radius:8px;break-inside:avoid}
.np-map svg{display:block;width:100%;height:auto;max-height:560px;margin:0 auto}
.np-hl{list-style:none;margin-top:4px}
.np-hl li{margin-bottom:5px;font-size:14px;line-height:1.55}
.np-hl li span{padding:1px 3px;border-radius:2px}
.np-empty{color:#9a958c;font-style:italic;padding:20px 0}
.np-foot{margin-top:34px;padding-top:12px;border-top:1px solid #e6e1d8;font-size:11px;color:#9a958c;text-align:center}
@media print{
  body.np-open>*{display:none!important}
  body.np-open .np-ov{display:block!important;position:static;background:none}
  .np-bar{display:none!important}
  .np-scroll{overflow:visible;padding:0;display:block}
  .np-page{max-width:none;box-shadow:none;border-radius:0;padding:0}
  .np-item{break-inside:avoid}
  @page{margin:16mm}
}
/* ===== Version accessible alternative ===== */
.b.alt-block{display:none}
body.a11y-alt .b.alt-block{display:block}
body.a11y-alt .b.has-alt{display:none}
.alt-skip{position:fixed;top:8px;left:8px;z-index:400;padding:12px 18px;border-radius:10px;border:2px solid var(--c-accent);background:var(--c-accent);color:var(--c-on-accent);font-family:var(--fb);font-size:14px;font-weight:700;cursor:pointer;transform:translateY(-200%);transition:transform .18s ease;box-shadow:0 6px 22px rgba(0,0,0,.3)}
.alt-skip:focus{transform:translateY(0);outline:3px solid #fff;outline-offset:2px}
.html-block{width:100%}
.html-ph{margin-top:10px;padding:14px 16px;border:1px dashed var(--c-line);border-radius:var(--rad);text-align:center;color:var(--c-soft)}
.html-ph b{display:block;font-family:var(--fh);font-size:14px;color:var(--c-text)}
.html-ph span{display:block;font-size:12px;margin-top:3px}
.alt-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--c-line);background:transparent;color:var(--c-text);font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.alt-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}
.alt-btn.on{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.alt-ic{font-size:15px;line-height:1}
.alt-tx{flex:1}
/* ===== Mode relecture ===== */
body.rv-on{padding-bottom:64px}
.rv-bar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--c-panel);border-top:2px solid #4a6fa5;box-shadow:0 -4px 18px rgba(0,0,0,.14)}
.rv-badge{padding:3px 9px;border-radius:6px;background:#4a6fa5;color:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.rv-info{font-size:12.5px;color:var(--c-soft);flex:1;min-width:150px}
.rv-save{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid #4a6fa5;background:#4a6fa5;color:#fff;font-family:var(--fb);font-size:13px;font-weight:700;cursor:pointer}
.rv-save:hover{opacity:.9}
.rv-tag{position:absolute;top:6px;right:6px;z-index:20;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;border:1px dashed #4a6fa5;background:var(--c-panel);color:#4a6fa5;font-family:var(--fb);font-size:11.5px;font-weight:700;cursor:pointer;opacity:.35;transition:opacity .15s}
.b:hover .rv-tag,.rv-tag.has{opacity:1}
.rv-tag.has{border-style:solid;background:#4a6fa5;color:#fff}
.rv-c{font-variant-numeric:tabular-nums}
body.rv-on .b{position:relative}
.rv-ov{position:fixed;inset:0;z-index:150;background:rgba(20,18,16,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.rv-modal{width:100%;max-width:540px;max-height:84vh;display:flex;flex-direction:column;background:var(--c-bg);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.rv-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--c-panel);border-bottom:1px solid var(--c-line)}
.rv-head b{font-family:var(--fh);font-size:16px;display:block}
.rv-head span{font-size:12px;color:var(--c-soft)}
.rv-x{border:0;background:transparent;color:var(--c-soft);font-size:15px;cursor:pointer;padding:5px}
.rv-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 20px}
.rv-empty{font-size:13px;color:var(--c-soft);font-style:italic;margin-bottom:12px}
.rv-item{padding:10px 12px;border-radius:8px;background:var(--c-panel);border:1px solid var(--c-line);margin-bottom:8px}
.rv-meta{display:flex;align-items:baseline;gap:8px}
.rv-meta b{font-size:12.5px}
.rv-meta span{font-size:11px;color:var(--c-soft);flex:1}

}}};</script><script>window.__COURSE__={"meta":{"title":"Voices of the Neighbourhood, welcome booklet","author":"Les Ondes Partagées","description":"The welcome booklet for European Solidarity Corps volunteers at Les Ondes Partagées, Dijon. Before you arrive, your first days, your mission and your learning.","image":"","imageAlt":""},"theme":{"preset":"custom","name":"Onde 21","font":"Fraunces + Hanken","primary":"#1d4e5f","accent":"#a8432a","bg":"#fbf8f2","text":"#1d1b18","fh":"Fraunces","fb":"Hanken Grotesk","nav":"sidebar","rounded":true,"radius":14,"logo":"","logoAlt":"","brand":["#1d4e5f","#a8432a","#c8961a","#4f7a43","#6b4a8a"],"contentWidth":760},"settings":{"lang":"en","progressionMode":"free","passScore":80,"showProgress":true,"progressTop":true,"allowNotes":true,"notesExclude":[],"reveal":"fade","revealSpeed":550,"allowHighlight":true,"showBadges":true,"extAssets":true,"scored":false,"globalProg":true,"hideProgress":false,"askName":true,"share":{"on":true,"to":"Camille, coordinator","email":"camille@ondes-partagees.example","phone":"","channels":["native","email","whatsapp","sms","copy"],"subject":"My welcome booklet answers"},"resume":{"on":true},"img":{"on":true,"maxW":1600,"quality":80}},"badges":[{"id":"bd1","name":"Ready to travel","desc":"You have gone through everything you need before leaving home.","img":"","cond":"module_done","value":0,"target":"m1"},{"id":"bd2","name":"At home in Dijon","desc":"You know your way around the city and the flat.","img":"","cond":"module_done","value":0,"target":"m2"},{"id":"bd3","name":"Safe hands","desc":"You know how to react when a young person shares a worry.","img":"","cond":"lesson_done","value":0,"target":"m3l2"}],"reviews":[{"id":"rv001","bid":"homeb01","lid":"home","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : couverture de la page d'accueil, format 1920x900. Place de la Libération et palais des Ducs à l'heure bleue, passants, fontaines allumées. Intention : l'émerveillement de l'arrivée. Recherche : \"place de la Libération Dijon heure bleue\", \"Dijon Palais des Ducs dusk square\".","done":false},{"id":"rv002","bid":"pg1b02","lid":"pg1","blk":"Ressources utiles","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : coordonnées des contacts. Projet simulé : renseigner les vrais numéros et horaires de la structure, du mentor et de l'assurance, puis vérifier que les deux liens externes répondent toujours.","done":false},{"id":"rv003","bid":"m1l1b01","lid":"m1l1","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture de leçon, format 1600x600, cadrage panoramique, zone calme en bas à gauche pour le titre. Les toits de Dijon en fin de journée, tuiles vernissées et tour Philippe le Bon. Intention : donner envie, poser le décor. Recherche : \"toits de Dijon tuiles vernissées coucher de soleil\", \"Dijon rooftops glazed tiles sunset\".","done":false},{"id":"rv004","bid":"m1l1b04","lid":"m1l1","blk":"Dézoom révélateur","who":"Claude","at":1794405600000,"txt":"IMAGE : dézoom révélateur, format 1600x1000 paysage. Départ sur un détail, un micro tenu par une main de jeune, puis on découvre un petit studio associatif avec trois jeunes, casques, ordinateur portable. Intention : montrer d'emblée que ce sont les jeunes qui prennent la parole. Le point de départ X 38 % Y 40 % doit tomber sur le micro, ajuster après pose. Recherche : \"studio radio associative jeunes micro\", \"community radio teenagers microphone studio\". Personnes avec autorisation de droit à l'image.","done":false},{"id":"rv005","bid":"m1l1b05","lid":"m1l1","blk":"Tableau / grille","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : tableau « At a glance ». Projet simulé : dates, nombre de volontaires, horaires et nom de la structure sont fictifs. Remplacer par les données réelles de votre accord de volontariat avant diffusion.","done":false},{"id":"rv006","bid":"m1l1b06","lid":"m1l1","blk":"Vidéo interactive (réflexion)","who":"Claude","at":1794405600000,"txt":"VIDÉO : message de bienvenue de l'équipe, durée cible 5 min. Script complet dans le carnet de production, section V1. Arrêts provisoires à 0:52, 2:28 et 4:15, à recaler sur le montage final. Prévoir sous-titres anglais et la transcription.","done":false},{"id":"rv007","bid":"m1l1b07","lid":"m1l1","blk":"Cartes flash","who":"Claude","at":1794405600000,"txt":"IMAGE : 4 portraits pour les cartes flash, format carré 800x800, plan poitrine, lumière naturelle, regard caméra, fond lié au rôle (table de mixage, terrasse, studio). Intention : rendre l'équipe familière avant l'arrivée. Personnages fictifs, à remplacer par les vraies personnes avec leur accord écrit.","done":false},{"id":"rv008","bid":"m1l1b08","lid":"m1l1","blk":"Chronologie","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : calendrier du volontariat. Les dates de la formation à l'arrivée et de l'évaluation à mi-parcours sont fixées par l'Agence nationale. Les remplacer par les dates officielles dès qu'elles sont connues.","done":false},{"id":"rv009","bid":"m1l2b01","lid":"m1l2","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Une table de réunion vue de haut, carnets, post-its, tasses, mains qui écrivent. Intention : le cadre, l'organisation, sans austérité. Recherche : \"réunion équipe associative table post-it vue de haut\", \"team meeting table sticky notes top view\".","done":false},{"id":"rv010","bid":"m1l2b07","lid":"m1l2","blk":"Accordéon","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : contenu de l'accordéon « ce qui est pris en charge ». Les règles générales du Corps européen de solidarité sont reprises sans montant. Vérifier dans le guide du programme de l'année et dans l'accord de volontariat : nom de l'assurance, montants, cours de langue en ligne proposés.","done":false},{"id":"rv011","bid":"m1l3b01","lid":"m1l3","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Un sac à dos ouvert vu de haut, passeport, billet de train, écouteurs, imperméable plié, carnet. Intention : la préparation concrète. Recherche : \"sac à dos voyage préparation vue de haut\", \"packing backpack flat lay travel\".","done":false},{"id":"rv012","bid":"m1l3b05","lid":"m1l3","blk":"Cartes à swiper (quiz)","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : cartes « Refunded or not? ». La règle du bagage supplémentaire dépend de votre politique interne. Ajuster les cartes à ce que votre structure accepte réellement.","done":false},{"id":"rv013","bid":"m1l3b07","lid":"m1l3","blk":"Graphique","who":"Claude","at":1794405600000,"txt":"SOURCE : normales Météo-France 1991-2020, station Dijon-Longvic (fiche climatologique 21473001), consultées le 11 novembre 2026. Valeurs reprises telles quelles.","done":false},{"id":"rv014","bid":"m2l1b01","lid":"m2l1","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Gare de Dijon-Ville, hall ou parvis, voyageurs avec valises, lumière du matin. Intention : le moment de l'arrivée. Recherche : \"gare Dijon-Ville parvis voyageurs\", \"Dijon railway station travellers\".","done":false},{"id":"rv015","bid":"m2l1b05","lid":"m2l1","blk":"Carte des lieux","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : coordonnées des dix lieux de la carte, posées à partir de positions connues mais à contrôler une par une dans OpenStreetMap. Le logement et la structure d'accueil sont fictifs : remplacer par les vraies adresses.","done":false},{"id":"rv016","bid":"m2l1b05","lid":"m2l1","blk":"Carte des lieux","who":"Claude","at":1794405600000,"txt":"DÉCISION : fond OpenStreetMap, qui ne s'affiche que dans le cours publié en https (ni dans l'aperçu de Studeo, ni depuis un fichier local). Pour un fond visible partout, passer le réglage sur « Image de fond » : capture de la zone de Dijon, puis latitude nord et sud, longitude ouest et est des bords de l'image.","done":false},{"id":"rv017","bid":"m2l1b06","lid":"m2l1","blk":"Image annotée","who":"Claude","at":1794405600000,"txt":"IMAGE : plan du logement, format 1400x900, dessin simple vu de dessus, pièces nommées en anglais, style épuré aux couleurs du thème. Les six points sont posés à des positions plausibles (entrée en bas à gauche, cuisine en haut à gauche, chambres à droite) : les ajuster après pose du plan réel. Recherche : \"plan appartement colocation simple vue de dessus\", \"simple flat floor plan illustration\".","done":false},{"id":"rv018","bid":"m2l1b08","lid":"m2l1","blk":"Audio","who":"Claude","at":1794405600000,"txt":"MÉDIA : enregistrement audio de dix phrases utiles, lues lentement deux fois chacune, durée cible 2 min 30. Texte exact dans le tableau qui suit, et dans le carnet de production section A1. Format .mp3, voix naturelle, pièce calme.","done":false},{"id":"rv019","bid":"m2l2b01","lid":"m2l2","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Rue de la Liberté ou rue piétonne du centre, maisons à colombages, terrasses, passants, éventuellement le tram au fond. Intention : la vie quotidienne, la ville à taille humaine. Recherche : \"Dijon rue piétonne colombages terrasses\", \"Dijon old town street half-timbered cafe\".","done":false},{"id":"rv020","bid":"m2l2b03","lid":"m2l2","blk":"Titre + texte","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : population de Dijon (environ 160 000 habitants, chiffre INSEE à confirmer à la date de diffusion).","done":false},{"id":"rv021","bid":"m2l2b04","lid":"m2l2","blk":"Onglets","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : onglet « Getting around ». Prise en charge de l'abonnement Divia par la structure et location de vélos au mois : à confirmer selon votre budget de projet et l'offre Divia en vigueur.","done":false},{"id":"rv022","bid":"m2l2b05","lid":"m2l2","blk":"Image à explorer (zoom)","who":"Claude","at":1794405600000,"txt":"IMAGE : plan schématique officiel du réseau tram Divia, format paysage 1600x1100, à demander à Divia ou à télécharger sur leur site avec l'autorisation d'usage. Les cinq points sont placés de façon plausible (gare à gauche, centre au milieu, T1 vers l'est, T2 nord et sud) : les recaler sur le plan réel.","done":false},{"id":"rv023","bid":"m2l2b07","lid":"m2l2","blk":"Galerie","who":"Claude","at":1794405600000,"txt":"IMAGE : galerie de six photos de la vie à Dijon, format 4:3, 1200x900. Halles un samedi, plaque de la chouette au sol, Lac Kir en automne, jardin Darcy et l'ours Pompon, jeunes en terrasse le soir, moutarde au marché. Intention : donner envie et rassurer. Recherche : \"Dijon Halles marché\", \"parcours de la chouette plaque\", \"lac Kir Dijon\", \"jardin Darcy ours Pompon\".","done":false},{"id":"rv024","bid":"m2l2b10","lid":"m2l2","blk":"Roue aléatoire","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : roue des missions. Gratuité des collections permanentes du musée des Beaux-Arts de Dijon et nombre d'étapes du parcours de la chouette (22) à confirmer avant diffusion.","done":false},{"id":"rv025","bid":"m3l1b01","lid":"m3l1","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Trois ados en interview de rue avec un enregistreur, immeubles en arrière-plan, ambiance vivante et positive. Intention : le cœur de la mission. Recherche : \"jeunes interview micro quartier\", \"teenagers street interview recorder neighbourhood\". Autorisations parentales indispensables si mineurs.","done":false},{"id":"rv026","bid":"m3l1b03","lid":"m3l1","blk":"Citation","who":"Claude","at":1794405600000,"txt":"DÉCISION : citation fictive écrite pour le projet simulé. La remplacer par une vraie parole de jeune, recueillie avec son accord et celui de ses parents, ou la supprimer.","done":false},{"id":"rv027","bid":"m3l1b05","lid":"m3l1","blk":"Curseur de comparaison","who":"Claude","at":1794405600000,"txt":"IMAGE : curseur de comparaison, deux photos du même immeuble au même cadrage, format 1600x1000. À gauche un cadrage « reportage » froid, de loin, vide, crépuscule. À droite le même lieu photographié par un jeune, de jour, avec de la vie. Intention : faire sentir que le cadrage fabrique le récit. Idéalement produites par les jeunes de l'atelier. Recherche : \"barre immeuble crépuscule\", \"vie de quartier immeuble enfants jouent\".","done":false},{"id":"rv028","bid":"m3l1b07","lid":"m3l1","blk":"Tri par catégories","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : carte « The tram line T2 opened in 2012 ». Les deux lignes du tram de Dijon ont été mises en service en 2012, à confirmer avant diffusion.","done":false},{"id":"rv029","bid":"m3l1b09","lid":"m3l1","blk":"Tableau / grille","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : semaine type fictive pour le projet simulé. Remplacer par l'emploi du temps réel, en gardant deux jours de repos complets par semaine.","done":false},{"id":"rv030","bid":"m3l2b01","lid":"m3l2","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Une animatrice et un ado assis de dos sur un banc, en conversation, lumière douce. Intention : la bienveillance et la confiance, sans dramatiser. Recherche : \"animatrice adolescent banc conversation de dos\", \"youth worker teenager talking bench from behind\".","done":false},{"id":"rv031","bid":"m3l2b06","lid":"m3l2","blk":"QCM","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : règle de consentement pour la diffusion de la voix et de l'image d'un mineur (accord du jeune et autorisation écrite d'un titulaire de l'autorité parentale). Faire valider la formulation par votre structure ou un juriste.","done":false},{"id":"rv032","bid":"m4l1b01","lid":"m4l1","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Un carnet ouvert couvert de notes manuscrites et petits croquis, casque audio, tasse de thé, lumière de fenêtre. Intention : le journal d'apprentissage, le recul. Recherche : \"carnet notes manuscrites casque audio table\", \"journal notebook handwritten notes headphones\".","done":false},{"id":"rv033","bid":"m4l1b04","lid":"m4l1","blk":"Post-its","who":"Claude","at":1794405600000,"txt":"DÉCISION : la couleur porte ici une catégorie (inquiétudes, attentes, apports). Pour ne pas faire reposer le sens sur la seule couleur, la consigne invite à commencer chaque post-it par le mot « Worry », « Hope » ou « Bring ». À conserver si vous gardez l'activité en l'état.","done":false},{"id":"rv034","bid":"m4l1b05","lid":"m4l1","blk":"Radar d'autoévaluation","who":"Claude","at":1794405600000,"txt":"SOURCE : les huit compétences clés reprises du cadre européen (Recommandation du Conseil du 22 mai 2018 sur les compétences clés pour l'éducation et la formation tout au long de la vie), intitulés raccourcis pour tenir dans le radar.","done":false},{"id":"rv035","bid":"m4l1b08","lid":"m4l1","blk":"Mot de passe","who":"Claude","at":1794405600000,"txt":"DÉCISION : mot de passe d'étape « mi-parcours ». Mot proposé : chouette. À communiquer par le mentor lors du rendez-vous d'évaluation à mi-parcours, ou à remplacer.","done":false},{"id":"rv036","bid":"m4l2b01","lid":"m4l2","blk":"Espaceur","who":"Claude","at":1794405600000,"txt":"IMAGE : ouverture, format 1600x600. Une valise près de la porte d'un appartement lumineux, une carte d'au revoir couverte de signatures posée dessus. Intention : l'émotion du départ, sans tristesse. Recherche : \"valise porte départ carte au revoir\", \"suitcase door farewell card\".","done":false},{"id":"rv037","bid":"m4l2b03","lid":"m4l2","blk":"Mot de passe","who":"Claude","at":1794405600000,"txt":"DÉCISION : mot de passe d'étape « départ ». Mot proposé : moutarde. À communiquer par la coordinatrice lors de l'évaluation finale, ou à remplacer.","done":false},{"id":"rv038","bid":"m4l2b07","lid":"m4l2","blk":"Partage et reprise","who":"Claude","at":1794405600000,"txt":"VÉRIFIER : destinataire des réponses réglé dans Cours › Partage. Le courriel camille@ondes-partagees.example est fictif : le remplacer, et ajouter si besoin un numéro WhatsApp au format international.","done":false},{"id":"rv039","bid":"m4l2b07","lid":"m4l2","blk":"Partage et reprise","who":"Claude","at":1794405600000,"txt":"DÉCISION : les réponses partent depuis l'application de l'apprenant, après relecture. Prévoir dans votre politique de protection des données une ligne sur l'usage de ces réponses (préparation de l'entretien final, amélioration de l'accueil) et leur durée de conservation.","done":false}],"glossary":[{"id":"g01","term":"European Solidarity Corps","def":"The European Union programme that funds volunteering and solidarity projects for people aged 18 to 30."},{"id":"g02","term":"Quality Label","def":"The certificate an organisation needs to host or support volunteers in the European Solidarity Corps."},{"id":"g03","term":"host organisation","def":"The organisation where you volunteer, which organises your activities, accommodation and daily support."},{"id":"g04","term":"supporting organisation","def":"The organisation in your home country that helps you prepare and stays in touch during your volunteering."},{"id":"g05","term":"volunteering agreement","def":"The document signed before departure that sets out your dates, tasks, hours, leave and allowances."},{"id":"g06","term":"coordinator","def":"The person at the host organisation in charge of your practical arrangements and overall follow-up."},{"id":"g07","term":"tutor","def":"The person you work with day to day, who guides you in your tasks and activities."},{"id":"g08","term":"mentor","def":"An independent person who helps you reflect on your experience and learning, in confidence."},{"id":"g09","term":"National Agency","def":"The body that manages the programme in a given country, organises trainings and checks projects."},{"id":"g10","term":"on-arrival training","def":"A few days of training with other newly arrived volunteers, organised by the National Agency."},{"id":"g11","term":"mid-term evaluation","def":"A meeting halfway through a long volunteering, to take stock with other volunteers and adjust."},{"id":"g12","term":"pocket money","def":"A monthly amount paid to the volunteer for personal expenses, set by the programme for each country."},{"id":"g13","term":"food allowance","def":"A monthly amount paid to the volunteer to buy food, when meals are not provided."},{"id":"g14","term":"European Health Insurance Card","def":"A free card for EU citizens that gives access to public healthcare in another EU country on the same terms as residents."},{"id":"g15","term":"Youthpass","def":"The European certificate that describes the learning outcomes of a volunteering or youth project, written by the participant."},{"id":"g16","term":"learning diary","def":"A personal notebook or file where you regularly write what you do, notice and learn."},{"id":"g17","term":"key competences","def":"Eight areas of knowledge, skills and attitudes defined by the European Union as essential for everyone, used in Youthpass."},{"id":"g18","term":"non-formal learning","def":"Learning that is planned and intentional but takes place outside schools and universities, through activities and experience."},{"id":"g19","term":"media literacy","def":"The ability to access, understand, question and create media content."},{"id":"g20","term":"priority neighbourhood","def":"A French label for urban areas with lower incomes, which receive specific public support."},{"id":"g21","term":"safeguarding","def":"Everything an organisation does to protect children and young people from harm while they take part in its activities."},{"id":"g22","term":"safeguarding lead","def":"The person responsible for handling any concern about the safety of a child or young person."},{"id":"g23","term":"informed consent","def":"Permission given by a person who understands what they agree to, for example being recorded and broadcast."},{"id":"g24","term":"Divia","def":"The name of Dijon's public transport network, which runs the trams, buses and bike rentals."},{"id":"g25","term":"Inclusion","def":"Making sure that everyone can take part and benefit, whatever their background, abilities or situation."},{"id":"g26","term":"web radio","def":"A radio station that broadcasts over the internet rather than on FM."}],"glossaryOn":true,"modules":[{"id":"m1","title":"Before you arrive","collapsed":false,"lessons":[{"id":"m1l1","title":"Your project in a nutshell","progression":"free","blocks":[{"id":"m1l1b01","type":"spacer","height":340,"fill":"image","color":"#e8e3da","texture":"dots","img":"","alt":"Rooftops of Dijon in the evening, with the bell tower of the Palais des Ducs above coloured tiled roofs.","imgSize":"cover","imgX":50,"imgY":50,"imgOpacity":100,"veil":48,"veilColor":"#0f2a33","veilH":100,"veilPos":"full","veilFade":false,"text":"Ten months behind the microphone","textSize":40,"textColor":"#ffffff","textAlign":"left","textPos":"bottom","textShadow":true,"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l1b02","type":"divider","shape":"wave","amplitude":22,"frequency":2,"thickness":0,"colorTop":"","colorBottom":"","flip":false,"shiftX":0,"height":56,"useNeighborImg":true,"texture":"none","textureOpacity":18,"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l1b03","type":"textgroup","layout":"h2_body","h1":"","h2":"Welcome, {prenom}","body":"<p>In every neighbourhood, people have stories worth telling. Most of them never reach the news. When they do, they are often told by someone who does not live there.</p><p>Voices of the Neighbourhood starts from a simple idea. Young people in Dijon should be the ones holding the microphone. For ten months, you will help them learn to interview, record, edit and broadcast their own stories on a small web radio called Onde 21. You will also learn a great deal yourself, and we will make sure you have the time and the support to notice it.</p><p>This booklet walks with you before, during and after your volunteering. Read it at your own pace and come back to it whenever you need. Some parts open later, on the day they become useful.</p>","align":"left","box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"color","pageColor":"#f3efe6","pageImage":"","pageSize":"cover"}},{"id":"m1l1b04","type":"zoomout","img":"","alt":"A young woman wearing headphones speaks into a microphone in a small radio studio, while two teenagers watch the sound levels on a laptop.","height":400,"x":38,"y":40,"zoom":4,"hint":"Zoom out slowly. Who is holding the microphone?","caption":"At Onde 21, the person at the microphone is almost never a professional. That is the whole point.","box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"},"instr":"Move the slider to zoom out step by step and discover the whole scene. With a keyboard, focus the slider and use the arrow keys.","showInstr":true},{"id":"m1l1b05","type":"grid","title":"At a glance","header":true,"headerCol":true,"striped":true,"compact":false,"align":"left","widths":[32,68],"rows":[["","Your volunteering"],["Project","Voices of the Neighbourhood"],["Programme","European Solidarity Corps, individual volunteering"],["Host organisation","Les Ondes Partagées, a community media association"],["Where","Dijon, Burgundy, France. Most activities take place in the Grésilles neighbourhood"],["When","1 March to 31 December 2027"],["Volunteers","Two, from two different countries"],["Time","35 hours a week, two full days off, two days of leave per month"],["Working languages","English with the team, French with the young people, and plenty of gestures in between"]],"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l1b06","type":"videoreflect","url":"","caption":"A five-minute welcome from the team, filmed in the studio and in the streets around it.","stops":[{"t":52,"q":"Camille says the young people chose the name Onde 21 themselves. What does that tell you about how this association works?","block":true},{"t":148,"q":"Inès describes a workshop where nothing went to plan. How do you usually react when a plan falls apart in front of a group?","block":true},{"t":255,"q":"Write down one question you would like to ask the team on your first day.","block":true}],"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"},"instr":"Start the video. It pauses three times so you can write a short answer. Your answers stay on your device and go into your notes.","showInstr":true},{"id":"m1l1b07","type":"flashcard","layout":"grid","align":"left","size":"m","items":[{"id":"fc1","front":"Camille, coordinator","back":"Camille runs the association and is your first contact for anything practical: the flat, money, schedule, safety. She is also the safeguarding lead. Ask her about the time a goat walked into a live broadcast.","img":"","alt":"Portrait of Camille, a woman in her forties with short grey hair, smiling in front of a radio mixing desk."},{"id":"fc2","front":"Inès, tutor","back":"Inès is a youth worker and your tutor. You will plan and run workshops with her every week. Ask her about rap, editing on a phone, or the best kebab in the Grésilles.","img":"","alt":"Portrait of Inès, a young woman with curly hair and a denim jacket, holding a handheld recorder."},{"id":"fc3","front":"Youssef, mentor","back":"Youssef does not work for the association. That is on purpose. Once a fortnight you meet him to talk about how you are doing and what you are learning, in complete confidence.","img":"","alt":"Portrait of Youssef, a man in his thirties with a beard and glasses, sitting at a café terrace."},{"id":"fc4","front":"Théo, sound technician","back":"Théo looks after the studio and the equipment. He will teach you how to record clean sound in a noisy room, which is harder than it looks. Ask him about his collection of broken microphones.","img":"","alt":"Portrait of Théo, a young man with a cap, adjusting the cables of a mixing desk."}],"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"},"instr":"Select each card to turn it over and meet the person behind the name. With a keyboard, reach a card with Tab and turn it with Enter.","showInstr":true},{"id":"m1l1b08","type":"timeline","align":"center","items":[{"id":"tl1","date":"January to February","title":"Getting ready from home","body":"Two online meetings with Camille and your future co-volunteer. You sign your volunteering agreement and book your travel once we have approved it.","img":"","alt":""},{"id":"tl2","date":"March","title":"Arrival and on-arrival training","body":"You settle in, meet the young people and join the on-arrival training run by the National Agency, a few days with other volunteers from all over France.","img":"","alt":""},{"id":"tl3","date":"April to June","title":"Workshops take shape","body":"You co-lead two weekly media workshops with Inès and record your first episode with a group of teenagers.","img":"","alt":""},{"id":"tl4","date":"July to August","title":"Summer radio","body":"Onde 21 broadcasts live from neighbourhood events. Long days, lots of people, and two weeks of leave you can take around it.","img":"","alt":""},{"id":"tl5","date":"Late July","title":"Mid-term evaluation","body":"A national meeting halfway through your volunteering, to take stock with other volunteers and adjust what needs adjusting.","img":"","alt":""},{"id":"tl6","date":"September to November","title":"Your own project","body":"You design and run a small project of your choice, with the support of the team.","img":"","alt":""},{"id":"tl7","date":"December","title":"Closing and Youthpass","body":"Final evaluation, your Youthpass certificate, and a farewell show you will probably remember for a long time.","img":"","alt":""}],"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l1b09","type":"reflect","prompt":"Imagine a friend asks you what you will be doing in Dijon. Write your answer in two or three sentences, as you would say it out loud. Come back to it after your first month and see what has changed.","placeholder":"I am going to Dijon to…","box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"},"instr":"Write your answer in the field below. It stays on your device and goes into your notes.","showInstr":true}]},{"id":"m1l2","title":"How your volunteering works","progression":"free","blocks":[{"id":"m1l2b01","type":"spacer","height":340,"fill":"image","color":"#e8e3da","texture":"dots","img":"","alt":"Two volunteers and a youth worker sitting around a table covered with notebooks, sticky notes and coffee cups.","imgSize":"cover","imgX":50,"imgY":50,"imgOpacity":100,"veil":48,"veilColor":"#0f2a33","veilH":100,"veilPos":"full","veilFade":false,"text":"Nobody volunteers alone","textSize":40,"textColor":"#ffffff","textAlign":"left","textPos":"bottom","textShadow":true,"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l2b02","type":"divider","shape":"wave","amplitude":22,"frequency":2,"thickness":0,"colorTop":"","colorBottom":"","flip":false,"shiftX":0,"height":56,"useNeighborImg":true,"texture":"none","textureOpacity":18,"box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"none","pageColor":"","pageImage":"","pageSize":"cover"}},{"id":"m1l2b03","type":"textgroup","layout":"h2_body","h1":"","h2":"Who does what?","body":"<p>Here is a small test before any explanation. It is your third week. Your pocket money has not arrived, tomorrow's workshop is still a blank page, and you have felt a bit low since Sunday. Who do you talk to, and about what?</p><p>Most volunteers answer \"my coordinator\" for everything. That works, up to a point. Your volunteering in the European Solidarity Corps is built around several people with different roles, and knowing who does what saves you time and some awkward conversations. Try sorting the situations below before reading on.</p>","align":"left","box":{"bg":"none","bgColor":"","bgImage":"","bgSize":"cover","radius":"","pad":false,"pageBg":"color","pageColor":"#f3efe6","pageImage":"","pageSize":"cover"}},{"id":"m1l2b04","type":"sortcat","prompt":"Who would you go to first? Place each situation in the right column, then check.","shuffle":true,"showFb":true,"cats":[{"id":"ca1","name":"Camille, coordinator","color":""},{"id":"ca2","name":"Inès, tutor","color":""},{"id":"ca3","name":"Youssef, mentor","color":""},{"id":"ca4","name":"The insurance helpline","color":""}],"items":[{"id":"it1","text":"Your pocket money is five days late.","cat":0,"img":""},{"id":"it2","text":"Your flatmate keeps inviting guests until 2 a.m.","cat":0,"img":""},{"id":"it3","text":"You have no idea how to open tomorrow's podcast workshop.","cat":1,"img":""},{"id":"it4","text":"You would like to try editing an episode on your own.","cat":1,"img":""},{"id":"it5","text":"You feel lonely and want to talk to someone outside work.","cat":2,"img":""},{"id":"it6","text":"You want to put words on what you are learning for your Youthpass.","cat":2,"img":""},{"id":"it7","text":"A dentist asks you to pay 90 euros and you need to know if you will be refunded.","cat":3,"img":""},{"id":"it8","text":"You need a new pair of glasses after breaking
