  /* ============ GRAPHIQUES (SVG maison) ============ */
  const CHART_PAL=['#2c2a4a','#c0653a','#3f7d5b','#4a6fa5','#a5594a','#b08d57','#6a7d8c','#8c5a8c'];
  function chartColor(i){return CHART_PAL[i%CHART_PAL.length];}
  function renderChart(b){
    const wrap=document.createElement('div');wrap.className='chart-card'+(b.frame===false?' no-frame':'');
    const pal=CHART_PAL;
    const col=i=>(b.series[i]&&b.series[i].color)||pal[i%pal.length];
    let html=b.title?'<div class="chart-title">'+E(b.title)+'</div>':'';
    const labels=b.labels||[];
    if(b.kind==='table'){
      html+='<table class="data-tbl"><thead><tr><th></th>'+b.series.map(s=>'<th>'+E(s.name)+'</th>').join('')+'</tr></thead><tbody>';
      labels.forEach((lb,r)=>{html+='<tr><th>'+E(lb)+'</th>'+b.series.map(s=>'<td>'+E(s.data[r]!=null?s.data[r]:'')+'</td>').join('')+'</tr>';});
      html+='</tbody></table>';wrap.innerHTML=html;return wrap;
    }
    if(b.kind==='pie'||b.kind==='doughnut'){
      const data=(b.series[0]&&b.series[0].data)||[];const tot=data.reduce((a,v)=>a+(+v||0),0)||1;
      let ang=-Math.PI/2,paths='';const cx=110,cy=110,rad=100;
      data.forEach((v,i)=>{const frac=(+v||0)/tot;const a2=ang+frac*Math.PI*2;
        const x1=cx+rad*Math.cos(ang),y1=cy+rad*Math.sin(ang),x2=cx+rad*Math.cos(a2),y2=cy+rad*Math.sin(a2);
        const large=frac>0.5?1:0;
        paths+='<path d="M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+rad+','+rad+' 0 '+large+',1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z" fill="'+col(i)+'" stroke="var(--c-panel)" stroke-width="2"></path>';
        ang=a2;});
      const hole=b.kind==='doughnut'?'<circle cx="'+cx+'" cy="'+cy+'" r="52" fill="var(--c-panel)"></circle>':'';
      html+='<svg viewBox="0 0 220 220" style="max-width:260px;display:block;margin:0 auto">'+paths+hole+'</svg>';
      html+='<div class="chart-legend">'+labels.map((lb,i)=>'<span><i style="background:'+col(i)+'"></i>'+E(lb)+' ('+Math.round((+data[i]||0)/tot*100)+'%)</span>').join('')+'</div>';
      wrap.innerHTML=html;return wrap;
    }
    if(b.kind==='radar'){
      const cx=150,cy=140,rad=100;const n=labels.length||3;
      let max=0;b.series.forEach(s=>s.data.forEach(v=>{if(+v>max)max=+v;}));max=max||1;const niceMax=Math.ceil(max/4)*4||4;
      const pt=(i,r)=>{const a=-Math.PI/2+i/n*Math.PI*2;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
      let g='';
      for(let k=1;k<=4;k++){const rr=rad*k/4;let poly=[];for(let i=0;i<n;i++){const[x,y]=pt(i,rr);poly.push(x.toFixed(1)+','+y.toFixed(1));}g+='<polygon points="'+poly.join(' ')+'" fill="none" stroke="var(--c-line)" stroke-width="1"></polygon>';}
      for(let i=0;i<n;i++){const[x,y]=pt(i,rad);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--c-line)"></line>';const[lx,ly]=pt(i,rad+16);g+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="10" fill="var(--c-soft)" text-anchor="middle">'+E(labels[i])+'</text>';}
      b.series.forEach((s,si)=>{let poly=[];for(let i=0;i<n;i++){const[x,y]=pt(i,rad*(+s.data[i]||0)/niceMax);poly.push(x.toFixed(1)+','+y.toFixed(1));}g+='<polygon points="'+poly.join(' ')+'" fill="'+col(si)+'" fill-opacity=".18" stroke="'+col(si)+'" stroke-width="2"></polygon>';});
      html+='<svg viewBox="0 0 300 290" style="width:100%;max-width:340px;display:block;margin:0 auto">'+g+'</svg>';
      if(b.series.length>1)html+='<div class="chart-legend">'+b.series.map((s,i)=>'<span><i style="background:'+col(i)+'"></i>'+E(s.name||('Série '+(i+1)))+'</span>').join('')+'</div>';
      wrap.innerHTML=html;return wrap;
    }
    if(b.kind==='hbar'){
      const W=560,rowH=34,pad=8,labW=90;const H=Math.max(120,labels.length*(rowH*Math.max(1,b.series.length)/1+pad)+30);
      let max=0;b.series.forEach(s=>s.data.forEach(v=>{if(+v>max)max=+v;}));max=max||1;const niceMax=Math.ceil(max/4)*4||4;
      const gw=W-labW-20;let g='';
      for(let k=0;k<=4;k++){const xx=labW+gw*k/4;g+='<line x1="'+xx+'" y1="10" x2="'+xx+'" y2="'+(H-20)+'" stroke="var(--c-line)"></line><text x="'+xx+'" y="'+(H-6)+'" font-size="10" fill="var(--c-soft)" text-anchor="middle">'+Math.round(niceMax*k/4)+'</text>';}
      const n=b.series.length;const bh=Math.min(22,(rowH-6)/n);
      labels.forEach((lb,i)=>{const y0=14+i*rowH;
        g+='<text x="'+(labW-8)+'" y="'+(y0+rowH/2)+'" font-size="11" fill="var(--c-soft)" text-anchor="end">'+E(lb)+'</text>';
        b.series.forEach((s,si)=>{const w=gw*(+s.data[i]||0)/niceMax;g+='<rect x="'+labW+'" y="'+(y0+si*bh).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(bh-2).toFixed(1)+'" rx="3" fill="'+col(si)+'"></rect>';});});
      html+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">'+g+'</svg>';
      if(b.series.length>1)html+='<div class="chart-legend">'+b.series.map((s,i)=>'<span><i style="background:'+col(i)+'"></i>'+E(s.name||('Série '+(i+1)))+'</span>').join('')+'</div>';
      wrap.innerHTML=html;return wrap;
    }
    // bar / stacked / line / area
    const W=560,H=300,pl=44,pb=34,pt=14,pr=14;const gw=W-pl-pr,gh=H-pt-pb;
    // largeur disponible par label sur l'axe des X : si les libellés sont longs

    // chevauchement, et on les tronque au-delà d'une longueur raisonnable.
    const nLab=labels.length||1;
    const slotX=gw/nLab;
    const maxLabLen=Math.max(4,Math.floor(slotX/6.2));
    const longest=labels.reduce((m,l)=>Math.max(m,(l||'').length),0);
    const tilt=(longest>maxLabLen)||(slotX<46&&longest>3);
    function xLabel(x,lb){
      const t=(lb||'');

      if(tilt){
        return '<text x="'+x.toFixed(1)+'" y="'+(H-pb+14)+'" font-size="10.5" fill="var(--c-soft)" text-anchor="end" transform="rotate(-32 '+x.toFixed(1)+' '+(H-pb+14)+')">'+E(shown)+(shown.length<t.length?'<title>'+E(t)+'</title>':'')+'</text>';
      }
      return '<text x="'+x.toFixed(1)+'" y="'+(H-pb+18)+'" font-size="11" fill="var(--c-soft)" text-anchor="middle">'+E(shown)+(shown.length<t.length?'<title>'+E(t)+'</title>':'')+'</text>';
    }
    let max=0;
    if(b.kind==='stacked'){labels.forEach((_,i)=>{let s=0;b.series.forEach(se=>s+=(+se.data[i]||0));if(s>max)max=s;});}
    else b.series.forEach(s=>s.data.forEach(v=>{if(+v>max)max=+v;}));
    max=max||1;const niceMax=Math.ceil(max/4)*4||4;
    const xAt=i=>pl+(labels.length<=1?gw/2:gw*i/(labels.length-1));
    const yAt=v=>pt+gh-(gh*(+v||0)/niceMax);
    let g='';
    for(let k=0;k<=4;k++){const yy=pt+gh*k/4;const val=Math.round(niceMax*(4-k)/4);
      g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="var(--c-line)" stroke-width="1"></line>';
      g+='<text x="'+(pl-8)+'" y="'+(yy+4)+'" font-size="11" fill="var(--c-soft)" text-anchor="end">'+val+'</text>';}
    if(b.kind==='bar'){
      const groups=labels.length||1;const bandw=gw/groups;const n=b.series.length;const bw=Math.min(46,bandw/(n+0.6));
      labels.forEach((lb,i)=>{const x0=pl+bandw*i+(bandw-bw*n)/2;
        b.series.forEach((s,si)=>{const v=s.data[i];const y=yAt(v);const x=x0+bw*si;
          g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+(pt+gh-y).toFixed(1)+'" rx="3" fill="'+col(si)+'"></rect>';});
        g+=xLabel(pl+bandw*i+bandw/2,lb);});
    } else if(b.kind==='stacked'){
      const groups=labels.length||1;const bandw=gw/groups;const bw=Math.min(54,bandw*0.6);
      labels.forEach((lb,i)=>{let acc=0;const x=pl+bandw*i+(bandw-bw)/2;
        b.series.forEach((s,si)=>{const v=+s.data[i]||0;const y=yAt(acc+v);const h=gh*v/niceMax;
          g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col(si)+'"></rect>';acc+=v;});
        g+=xLabel(x+bw/2,lb);});
    } else { // line / area
      b.series.forEach((s,si)=>{let pts=labels.map((_,i)=>xAt(i).toFixed(1)+','+yAt(s.data[i]).toFixed(1)).join(' ');
        if(b.kind==='area'){g+='<polygon points="'+pl+','+(pt+gh)+' '+pts+' '+(W-pr)+','+(pt+gh)+'" fill="'+col(si)+'" fill-opacity=".15"></polygon>';}

        labels.forEach((_,i)=>{g+='<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(s.data[i]).toFixed(1)+'" r="3.5" fill="'+col(si)+'"></circle>';});});
      labels.forEach((lb,i)=>{g+=xLabel(xAt(i),lb);});

  /* ============ QUIZ ============ */
  let onQuizAnswered=function(){};

  function renderQuiz(b){

    } else if(b.type==='match'){

      inner+='<div class="mt-wrap">'+
        '<div class="mt-pool" id="mtPool-'+b.id+'"><div class="mt-pool-h">'+T('Étiquettes à placer')+' <span class="mt-n"></span></div><div class="mt-drop mt-src"></div></div>'+
        '<div class="mt-rows">'+b.pairs.map((p,i)=>

          '<span class="mt-link" aria-hidden="true"></span>'+

    } else if(b.type==='blank'){    } else if(b.type==='blank'){
      const parts=String(b.text||'').split(/\[([^\]]*)\]/);let bi=0;
      let h='';parts.forEach((seg,i)=>{if(i%2===0){h+=E(seg);}else{const idx=bi++;let cls='';let val='';if(locked&&prev.ans){val=prev.ans[idx]||'';cls=blankOk(val,seg)?'ok':'ko';}h+='<input data-bi="'+idx+'" data-ans="'+E(seg)+'" value="'+E(val)+'" class="'+cls+'"'+(locked?' disabled':'')+'>';}});
      inner+='<div class="blank-text">'+h+'</div>';
    }

    inner+='<div class="quiz-actions"><button class="quiz-check"'+(locked?' style="display:none"':'')+'>'+T('Vérifier')+'</button><button class="quiz-retry"'+(locked?' style="display:inline-block"':'')+'>'+T('Réessayer')+'</button></div>';
    let perFb='';
    if(locked&&(b.type==='qcm'||b.type==='multi')&&prev.sel){

    }
    inner+='<div class="quiz-fb'+(locked?(prev.correct?' ok show':' no show'):'')+'">'+(locked?'<b>'+(prev.correct?'Correct':T('Pas tout à fait'))+'</b>'+fmt(T(prev.correct?b.fbOk:b.fbNo))+perFb:'')+'</div>';
    inner+='</div>';
    wrap.innerHTML=inner;

    const fb=wrap.querySelector('.quiz-fb'),checkBtn=wrap.querySelector('.quiz-check'),retryBtn=wrap.querySelector('.quiz-retry');

    // sélection (qcm/multi)
    if(b.type==='qcm'||b.type==='multi'){
      const syncChecked=()=>wrap.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked',x.classList.contains('sel')?'true':'false'));
      wrap.querySelectorAll('.opt').forEach(op=>{
        op.onclick=()=>{if(state.quiz[b.id]&&state.quiz[b.id].checked)return;
          if(b.type==='qcm'){wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));op.classList.add('sel');}

    }
    checkBtn&&(checkBtn.onclick=()=>{
      let correct=false,rec={checked:true};
      if(b.type==='qcm'||b.type==='multi'){
        const sel=[...wrap.querySelectorAll('.opt.sel')].map(o=>o.dataset.oid);
        if(!sel.length)return;
        const good=b.options.filter(o=>o.correct).map(o=>o.id);
        correct=sel.length===good.length&&sel.every(id=>good.includes(id));
        rec.sel=sel;
      } else if(b.type==='match'){
        const ans={};let all=true;
        wrap.querySelectorAll('.mt-slot').forEach(sl=>{
          const c=sl.querySelector('.mt-tag');

          return;

        correct=b.pairs.every(p=>ans[p.id]===p.right);rec.ans=ans;
        wrap.querySelectorAll('.mt-slot').forEach(sl=>{
          const c=sl.querySelector('.mt-tag');if(!c)return;
          const p=b.pairs[+sl.dataset.i];
          c.classList.add(c.textContent===p.right?'ok':'no');
        });
      } else if(b.type==='blank'){
        const ans={};let all=true;correct=true;
        wrap.querySelectorAll('input').forEach(inp=>{const i=+inp.dataset.bi;ans[i]=inp.value;if(!inp.value.trim())all=false;if(!blankOk(inp.value,inp.dataset.ans))correct=false;});
        if(!all)return;rec.ans=ans;
      }
      rec.correct=correct;state.quiz[b.id]=rec;persist();
      const fresh=renderQuiz(b);wrap.replaceWith(fresh);

    });
    // ---- association : glisser-déposer + clavier ----
    if(b.type==='match'){

      const slots=[...wrap.querySelectorAll('.mt-slot .mt-drop')];
      const zones=src?[src].concat(slots):slots;
      const seed=wrap.querySelector('.mt-init');
      let pick=null;
      const cnt=()=>{const n=wrap.querySelector('.mt-n');if(n&&src)n.textContent=src.children.length;};
      const say=(tag)=>{
        const z=tag.parentElement;                      // nul tant que l'étiquette n'est pas posée
        const sl=z?z.closest('.mt-slot'):null;
        let nm='';
        if(sl){const row=sl.closest('.mt-row');const lf=row?row.querySelector('.mt-left'):null;
          if(lf)nm=lf.textContent.replace(/^\s*\d+\s*/,'').trim();}
        tag.setAttribute('aria-label',tag.textContent+(nm?' — '+T('placé sur')+' '+nm:' — '+T('non placé')));
      };
      const place=(tag,zone)=>{
        const ex=zone.closest('.mt-slot')?zone.querySelector('.mt-tag'):null;
        if(ex&&src)src.appendChild(ex);      // une seule étiquette par ligne
        zone.appendChild(tag);
        tag.classList.remove('sel');pick=null;say(tag);cnt();
        if(ex)say(ex);
      };
      const mk=(txt2)=>{
        const t=document.createElement('span');t.className='mt-tag';t.textContent=txt2;
        t.draggable=!locked;t.tabIndex=0;t.setAttribute('role','button');
        say(t);
        t.addEventListener('dragstart',e=>{if(locked)return;pick=t;t.classList.add('drag');try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';}catch(x){}});
        t.addEventListener('dragend',()=>t.classList.remove('drag'));
        t.addEventListener('click',()=>{if(locked)return;
          if(pick===t){t.classList.remove('sel');pick=null;return;}
          if(pick)pick.classList.remove('sel');
          pick=t;t.classList.add('sel');});
        t.addEventListener('keydown',e=>{
          if(locked)return;
          if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();return;}
          if(pick!==t)return;
          const zi=zones.indexOf(t.parentElement);
          let n=-1;
          if(e.key==='ArrowDown')n=Math.min(zi+1,zones.length-1);
          else if(e.key==='ArrowUp')n=Math.max(zi-1,0);

        });
        return t;
      };
      if(seed&&src){
        [...seed.children].forEach(sp=>src.appendChild(mk(sp.textContent)));
        seed.remove();
      }
      if(locked&&prev.ans){
        // rejouer la réponse enregistrée
        wrap.querySelectorAll('.mt-slot').forEach(sl=>{
          const v=prev.ans[sl.dataset.pid];if(!v)return;
          const t=[...src.children].find(x=>x.textContent===v);
          if(t)sl.querySelector('.mt-drop').appendChild(t);
        });
        wrap.querySelectorAll('.mt-slot').forEach(sl=>{
          const t=sl.querySelector('.mt-tag');if(!t)return;

        });

        z.addEventListener('dragover',e=>{if(locked)return;e.preventDefault();(z.closest('.mt-slot')||z.closest('.mt-pool')).classList.add('over');});
        z.addEventListener('dragleave',()=>{const h=z.closest('.mt-slot')||z.closest('.mt-pool');if(h)h.classList.remove('over');});
        z.addEventListener('drop',e=>{

        const host=z.closest('.mt-slot')||z.closest('.mt-pool');

      });
    }
    retryBtn&&(retryBtn.onclick=()=>{delete state.quiz[b.id];persist();const fresh=renderQuiz(b);wrap.replaceWith(fresh);onQuizAnswered();});
    return wrap;

  /* ============ RÉFLEXION ============ */
  const ic2={marker:'<path d="M15 3l6 6-9 9H6v-6z"/><path d="M4 21h16"/>'};
  const HL_COLORS=[['#ffe066','Jaune'],['#a0e7a0','Vert'],['#9bd4ff','Bleu'],['#ffb3c6','Rose']];
  let hlActive=null;
  // ================= BADGES =================
  const BC_LBL={progress:'Atteindre {v} % de progression',lessons_all:'Terminer toutes les leçons',lesson_done:'Terminer une leçon précise',module_done:'Terminer un module précis',score:'Obtenir {v} % au score global',quiz_all:'Répondre à toutes les questions',quiz_correct:'Réussir {v} questions',quiz_perfect:'Répondre juste à toutes les questions',reflect_count:'Rédiger {v} réflexions',reflect_all:'Rédiger toutes les réflexions',postit_count:'Créer {v} post-its',highlight_count:'Surligner {v} passages',notes_dl:'Télécharger ses notes',time:'Passer {v} minutes dans le cours',spots:'Explorer {v} points',scratch:'Gratter {v} carte(s)',flip:'Retourner {v} flashcards',slider:'Utiliser {v} curseur(s) de comparaison',lessons_count:'Terminer {v} leçons',lesson_half:'Terminer la moitié des leçons',modules_all:'Terminer tous les modules',modules_count:'Terminer {v} modules',first_lesson:'Terminer la première leçon',quiz_attempt:'Tenter une première question',quiz_half:'Réussir la moitié des questions',score_pass:'Atteindre le score de réussite',perfect_complete:'Terminer le cours sans faute',wheel_spin:'Faire tourner la roue',swipe_done:'Terminer un tri par glissement',swipe_count:'Trier {v} cartes',mindmap_started:'Commencer une carte mentale',mindmap_done:'Compléter une carte mentale',mindmap_branches:'Créer {v} branches de carte',reflect_first:'Rédiger une première réflexion',postit_first:'Créer un premier post-it',highlight_first:'Surligner un premier passage',explorer:'Explorer {v} activités interactives',explorer_all:'Explorer toutes les activités'};
  function badgeText(bd){return T(BC_LBL[bd.cond]||'').replace('{v}',bd.value==null?'':bd.value);}
  function stats(){state.stats=state.stats||{time:0,dl:0,spots:{},scratch:{},flip:{},slider:{}};
    ['spots','scratch','flip','slider'].forEach(k=>{if(!state.stats[k])state.stats[k]={};});return state.stats;}
  function track(kind,id){const st=stats();st[kind][id]=1;persist();checkBadges();}
  function allB(){const r=[];lessons.forEach(o=>o.l.blocks.forEach(b=>r.push(b)));return r;}
  function quizB(){return allB().filter(b=>b.points!=null);}
  function scorePct(){
    const qs=quizB();if(!qs.length)return 0;
    let tot=0,got=0;
    qs.forEach(q=>{const pt=+q.points||0;tot+=pt;const r=state.quiz[q.id];if(r&&r.correct)got+=pt;});
    return tot?Math.round((got/tot)*100):0;
  }
  function mmAll(){return Object.keys(state.mmaps||{}).map(function(k){return state.mmaps[k];});}
  function mmHasNode(mm){return (mm.nodes||[]).some(function(n){return n.label&&n.label.trim();});}
  function modArr(){var seen={},a=[];lessons.forEach(function(o){if(!seen[o.m.id]){seen[o.m.id]=1;a.push(o.m);}});return a;}
  function modDone(m){var ls=lessons.filter(function(o){return o.m.id===m.id;});return ls.length>0&&ls.every(function(o){return state.done[o.l.id];});}
  function interB(){return allB().filter(function(b){return ['flashcard','hotspot','zoomin','beforeafter','wheel','scratch','swipesort','swipequiz','mindmapreflect'].indexOf(b.type)>=0;});}
  function bEngaged(b){var sx=stats();
    switch(b.type){
      case 'flashcard': return Object.keys(sx.flip).some(function(k){return k.split(':')[0]===b.id;});
      case 'hotspot': case 'zoomin': return Object.keys(sx.spots).some(function(k){return k.split(':')[0]===b.id;});
      case 'beforeafter': return !!sx.slider[b.id];
      case 'wheel': return !!(state.wheel&&state.wheel[b.id])||!!sx.slider['wheel:'+b.id];
      case 'scratch': return !!sx.scratch[b.id];
      case 'swipesort': case 'swipequiz': {var r=(state.swipe||{})[b.id];return !!(r&&r.idx>0);}
      case 'mindmapreflect': {var mm=(state.mmaps||{})[b.id];return !!(mm&&((mm.center&&mm.center.trim())||mmHasNode(mm)));}
      case 'selfradar': {var rd=(state.radars||{})[b.id];return !!(rd&&rd.v&&Object.keys(rd.v).some(function(k){return rd.v[k]>0;}));}
    }
    return false;
  }
  function badgeOk(bd){
    const st=state,v=+bd.value||0,sx=stats();
    const totL=lessons.length,doneL=lessons.filter(o=>st.done[o.l.id]).length;
    const cnt=o=>Object.keys(o||{}).length;
    switch(bd.cond){
      case 'progress': return totL>0&&(doneL/totL)*100>=v;
      case 'lessons_all': return totL>0&&doneL===totL;
      case 'lesson_done': return !!st.done[bd.target];
      case 'module_done': {const ls=lessons.filter(o=>o.m.id===bd.target);return ls.length>0&&ls.every(o=>st.done[o.l.id]);}
      case 'score': return scorePct()>=v;
      case 'quiz_all': {const qs=quizB();return qs.length>0&&qs.every(q=>st.quiz[q.id]);}
      case 'quiz_correct': return Object.keys(st.quiz).filter(k=>st.quiz[k]&&st.quiz[k].correct).length>=v;
      case 'quiz_perfect': {const qs=quizB();return qs.length>0&&qs.every(q=>st.quiz[q.id]&&st.quiz[q.id].correct);}
      case 'reflect_count': return Object.keys(st.notes||{}).filter(k=>(st.notes[k]||'').trim()).length>=v;
      case 'reflect_all': {const rs=allB().filter(b=>b.type==='reflect');return rs.length>0&&rs.every(b=>(st.notes[b.id]||'').trim());}
      case 'postit_count': {let n=0;Object.keys(st.postits||{}).forEach(k=>{n+=(st.postits[k]||[]).filter(x=>x.t&&x.t.trim()).length;});return n>=v;}
      case 'highlight_count': {let n=0;Object.keys(st.hl||{}).forEach(k=>{n+=(st.hl[k]||[]).length;});return n>=v;}
      case 'notes_dl': return (sx.dl||0)>=1;
      case 'time': return (sx.time||0)>=v;
      case 'spots': return cnt(sx.spots)>=v;
      case 'scratch': return cnt(sx.scratch)>=Math.max(1,v);
      case 'flip': return cnt(sx.flip)>=v;
      case 'slider': return cnt(sx.slider)>=Math.max(1,v);
      case 'lessons_count': return doneL>=v;
      case 'lesson_half': return totL>0&&doneL>=Math.ceil(totL/2);
      case 'modules_all': {var ms=modArr();return ms.length>0&&ms.every(modDone);}
      case 'modules_count': return modArr().filter(modDone).length>=v;
      case 'first_lesson': return lessons.length>0&&!!st.done[lessons[0].l.id];
      case 'quiz_attempt': return Object.keys(st.quiz||{}).length>=1;
      case 'quiz_half': {var qh=quizB();var ok=Object.keys(st.quiz).filter(function(k){return st.quiz[k]&&st.quiz[k].correct;}).length;return qh.length>0&&ok>=Math.ceil(qh.length/2);}
      case 'score_pass': return quizB().length>0&&scorePct()>=(C.settings.passScore||80);
      case 'perfect_complete': {var qp=quizB();return totL>0&&doneL===totL&&qp.length>0&&qp.every(function(q){return st.quiz[q.id]&&st.quiz[q.id].correct;});}
      case 'wheel_spin': return Object.keys(state.wheel||{}).length>=1;
      case 'swipe_done': return allB().some(function(b){if(b.type!=='swipesort'&&b.type!=='swipequiz')return false;var r=(state.swipe||{})[b.id];if(!r)return false;var cc=(b.cards||[]).filter(function(c){return c.text&&c.text.trim();}).length;return cc>0&&r.idx>=cc;});
      case 'swipe_count': {var sn=0;Object.keys(state.swipe||{}).forEach(function(k){sn+=((state.swipe[k]||{}).idx)||0;});return sn>=v;}
      case 'mindmap_started': return mmAll().some(function(mm){return (mm.center&&mm.center.trim())||mmHasNode(mm);});
      case 'mindmap_done': return mmAll().some(function(mm){return (mm.center&&mm.center.trim())&&mmHasNode(mm);});
      case 'mindmap_branches': {var mn=0;mmAll().forEach(function(mm){mn+=(mm.nodes||[]).filter(function(x){return x.label&&x.label.trim();}).length;});return mn>=v;}
      case 'reflect_first': return Object.keys(st.notes||{}).filter(function(k){return (st.notes[k]||'').trim();}).length>=1;
      case 'postit_first': {var pn=0;Object.keys(st.postits||{}).forEach(function(k){pn+=(st.postits[k]||[]).filter(function(x){return x.t&&x.t.trim();}).length;});return pn>=1;}
      case 'highlight_first': {var hn=0;Object.keys(st.hl||{}).forEach(function(k){hn+=(st.hl[k]||[]).length;});return hn>=1;}
      case 'explorer': return interB().filter(bEngaged).length>=v;
      case 'explorer_all': {var ib=interB();return ib.length>0&&ib.every(bEngaged);}
    }
    return false;
  }
  function checkBadges(){
    if(C.settings.showBadges===false||!C.badges||!C.badges.length)return;
    state.badges=state.badges||{};
    let n=0,last=null;
    C.badges.forEach(bd=>{
      if(state.badges[bd.id])return;
      if(badgeOk(bd)){state.badges[bd.id]=Date.now();n++;last=bd;}
    });
    if(n){persist();updBadgeBtn();
      if(last)badgeToast(last,n);
      try{checkPageUnlocks();}catch(e){}
    }
  }
  function badgeToast(bd,n){

    t.innerHTML='<div class="bd-tico">'+(bd.img?'<img src="'+bd.img+'" alt="">':svgIco('<path d="M6 3h12v6a6 6 0 0 1-12 0z"/><path d="M9 21h6M12 15v6"/>',22))+'</div>'+
      '<div><b>'+T('Badge débloqué')+(n>1?' (×'+n+')':'')+'</b><span>'+E(bd.name||'')+'</span></div>';

  }
  function badgeCount(){const tot=(C.badges||[]).length;const got=Object.keys(state.badges||{}).filter(k=>(C.badges||[]).some(b=>b.id===k)).length;return [got,tot];}

  function badgeGridHTML(){
    return '<div class="bd-grid">'+(C.badges||[]).map(bd=>{

  var capMode='texte'; // 'texte' ou 'visuel'
  function onCapClick(e){

  // texte d'un bloc en gardant la structure (sauts de ligne, listes)
  function blocTexte(host){
    const clone=host.cloneNode(true);
    // retirer les outils (poignées, boutons d'édition)
    clone.querySelectorAll('.rv-tag,.cap-tool,.hl-tool,.eb-tools,button.np-btn').forEach(function(x){x.remove();});
    let out=[];
    clone.querySelectorAll('li').forEach(function(li){li.textContent='• '+li.textContent;});
    // remplacer les blocs par des retours ligne
    clone.querySelectorAll('p,li,h1,h2,h3,h4,div,br').forEach(function(el){
      if(el.tagName==='BR'){el.replaceWith('\n');}
    });
    let txt=(clone.innerText||clone.textContent||'');
    // normaliser : lignes vides multiples réduites
    txt=txt.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim();
    return txt;
  }
  // instantané visuel : HTML du bloc avec styles calculés, autonome
  function snapshotBloc(host){
    const src=host.querySelector('.b-in')||host;
    const clone=src.cloneNode(true);
    clone.querySelectorAll('.rv-tag,.cap-tool,.hl-tool,.eb-tools,.cont-btn,input,textarea,button').forEach(function(x){
      // les champs deviennent leur valeur figée pour rester lisibles
      if(x.tagName==='INPUT'||x.tagName==='TEXTAREA'){const s=document.createElement('span');s.textContent=x.value||'';x.replaceWith(s);}
      else x.remove();
    });
    // inliner quelques styles clés pour un rendu fidèle hors contexte
    inlineStyles(src,clone);
    const w=Math.min(680,Math.round(src.getBoundingClientRect().width)||600);
    return '<div class="cap-snap" style="max-width:'+w+'px">'+clone.outerHTML+'</div>';
  }
  function inlineStyles(orig,clone){
    const props=['color','background-color','background','font-size','font-weight','font-style','font-family','text-align','padding','margin','border','border-radius','line-height','text-decoration'];
    const os=orig.querySelectorAll('*'),cs=clone.querySelectorAll('*');
    function apply(o,c){
      try{const cs2=getComputedStyle(o);let s=c.getAttribute('style')||'';
        props.forEach(function(p){const v=cs2.getPropertyValue(p);if(v&&v!=='none'&&v!=='normal'&&v!=='0px'&&!/rgba\(0, 0, 0, 0\)/.test(v))s+=p+':'+v+';';});
        c.setAttribute('style',s);}catch(e){}
    }
    apply(orig,clone);
    for(let i=0;i<os.length&&i<cs.length;i++)apply(os[i],cs[i]);
  }
  function onHlSelect(){
    if(!hlActive||hlActive==='erase')return;
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed)return;

    if(txt.length<2)return;
    const host=(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement).closest('.b');
    if(!host||!contentEl.contains(host))return;
    if(host.querySelector('input,textarea'))return;
    try{
      const mk=document.createElement('mark');mk.className='hl';mk.dataset.c=hlActive;mk.style.background=hlActive;
      r.surroundContents(mk);
      bindEraser(mk);
      const lid=lessons[state.idx]?lessons[state.idx].l.id:'x';
      state.hl[lid]=state.hl[lid]||[];
      state.hl[lid].push({bid:host.dataset.bid||'',t:txt,c:hlActive});

  function bindEraser(mk){
    mk.onclick=()=>{
      if(hlActive!=='erase')return;

      const t=mk.textContent.trim();

      const par=mk.parentNode;while(mk.firstChild)par.insertBefore(mk.firstChild,mk);
      par.removeChild(mk);par.normalize();persist();
    };
  }
  function restoreHighlights(l){

    arr.forEach(h=>{
      const host=h.bid?contentEl.querySelector('.b[data-bid="'+h.bid+'"]'):contentEl;
      if(!host)return;
      const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,null);
      let node;
      while((node=w.nextNode())){
        if(node.parentElement&&node.parentElement.closest('mark.hl'))continue;
        const i=node.nodeValue.indexOf(h.t);
        if(i<0)continue;
        try{
          const r=document.createRange();r.setStart(node,i);r.setEnd(node,i+h.t.length);
          const mk=document.createElement('mark');mk.className='hl';mk.dataset.c=h.c;mk.style.background=h.c;
          r.surroundContents(mk);bindEraser(mk);
        }catch(e){}
        break;
      }
    });
  }

          s2.onclick=()=>{it.c=c;save();draw();};cw.appendChild(s2);});
        n.querySelector('.pit-del').onclick=()=>{arr.splice(i,1);save();draw();};
        // déplacement (souris et doigt)
        const grab=n.querySelector('.pit-grab');
        grab.addEventListener('pointerdown',ev=>{
          ev.preventDefault();
          const list=state.postits[b.id];let from=+n.dataset.i;
          n.classList.add('pit-drag');
          try{grab.setPointerCapture(ev.pointerId);}catch(e){}
          const move=e2=>{
            const el=document.elementFromPoint(e2.clientX,e2.clientY);
            const tgt=el&&el.closest?el.closest('.pit'):null;
            if(!tgt||tgt===n||!board.contains(tgt))return;
            const to=+tgt.dataset.i;
            if(to===from||isNaN(to))return;
            const [it2]=list.splice(from,1);list.splice(to,0,it2);
            from=to;save();draw();
            const again=board.querySelector('.pit[data-i="'+to+'"]');
            if(again){again.classList.add('pit-drag');
              const g2=again.querySelector('.pit-grab');
              try{g2.setPointerCapture(e2.pointerId);}catch(e){}
              g2.addEventListener('pointermove',move);g2.addEventListener('pointerup',up);g2.addEventListener('pointercancel',up);
              grab.removeEventListener('pointermove',move);grab.removeEventListener('pointerup',up);
            }
          };
          const up=()=>{
            board.querySelectorAll('.pit').forEach(x=>x.classList.remove('pit-drag'));
            grab.removeEventListener('pointermove',move);grab.removeEventListener('pointerup',up);grab.removeEventListener('pointercancel',up);
          };
          grab.addEventListener('pointermove',move);grab.addEventListener('pointerup',up);grab.addEventListener('pointercancel',up);
        });
        board.appendChild(n);
      });
      if(!arr.length)board.innerHTML='<div class="pit-empty">'+T('Aucune idée pour le moment.')+'</div>';
    }
    d.querySelector('.pit-add').onclick=()=>{
      state.postits[b.id]=state.postits[b.id]||[];
      state.postits[b.id].push({t:'',c:palette[state.postits[b.id].length%palette.length]});
      save();draw();
      setTimeout(()=>{const tas=board.querySelectorAll('textarea');if(tas.length)tas[tas.length-1].focus();},30);
    };
    draw();
    return d;
  }

  // ---- Fond global du cours : sections pleine largeur dans le flux ----
  function bandCss(pbg){
    if(!pbg)return '';
    if(pbg.type==='color')return 'background-color:'+pbg.color+';';
    if(pbg.type==='image')return 'background-image:url('+pbg.image+');background-size:'+(pbg.size==='repeat'?'auto':pbg.size)+';background-position:center;background-repeat:'+(pbg.size==='repeat'?'repeat':'no-repeat')+';';
    return '';
  }
  // couleur de fond en vigueur à chaque bloc (null = fond du thème)
  function effBgSeq(blocks){
    let cur=null;const seq=[];
    blocks.forEach(b=>{const p=blockPageBg(b);
      if(b.type==='spacer'){seq.push((p&&p.type==='color')?p.color:cur);return;}
      if(p)cur=(p.type==='color'?p.color:null);seq.push(cur);});
    return seq;
  }
  // découpe les blocs en sections ; les séparateurs sont collés ENTRE les sections
  /* Hauteur utile d'un bloc pour le calcul de chevauchement.
     Seuls les blocs à hauteur fixe sont connus d'avance ; les autres sont réputés
     assez grands (le texte fait au moins quelques dizaines de pixels). */
  function ovHeightOf(b){
    if(!b)return 0;
    if(b.type==='spacer')return Math.max(0,+b.height||0);
    if(b.type==='divider')return Math.max(0,+b.height||60);
    return 1e6;
  }
  /* Deux transitions qui encadrent un espaceur revendiquaient chacune toute leur hauteur.
     Sur un espaceur court, elles l'avalaient entièrement : plus rien à voir ni à cliquer.
     On répartit donc la place disponible et on laisse toujours une bande au voisin. */
  const OV_FLOOR=44;
  function ovSideOf(b,prev,next){
    // même règle que le rendu : la transition se pose sur la photo du voisin
    if(b.type!=='divider'||b.useNeighborImg===false)return null;
    const img=x=>{
      if(!x)return null;
      if(x.type==='spacer'&&x.fill==='image'&&x.img)return x.img;
      if(x.box&&x.box.pageBg==='image'&&x.box.pageImage)return x.box.pageImage;
      return null;
    };
    if(img(next))return 'bottom';
    if(img(prev))return 'top';
    return null;
  }
  function ovLimits(blocks){
    const lim={},side={};
    blocks.forEach((b,i)=>{
      if(b.type!=='divider')return;
      lim[b.id]=Math.max(0,+b.height||60);
      side[b.id]=ovSideOf(b,blocks[i-1],blocks[i+1]);
    });
    blocks.forEach((b,i)=>{
      if(b.type==='divider')return;
      if(b.type==='spacer'&&b.fill==='image'&&b.img)return;  // photo : la hauteur est compensée, rien à rogner
      const room=ovHeightOf(b);
      if(room>=1e6)return;                       // voisin de hauteur libre : rien à plafonner
      const claim=[];
      const prev=blocks[i-1],next=blocks[i+1];
      if(prev&&prev.type==='divider'&&side[prev.id]==='bottom')claim.push(prev);
      if(next&&next.type==='divider'&&side[next.id]==='top')claim.push(next);
      if(!claim.length)return;
      const budget=Math.max(0,room-OV_FLOOR);   // le voisin garde toujours une bande
      const want=claim.reduce((a,d)=>a+(lim[d.id]||0),0);
      if(want<=budget)return;
      const k=want?budget/want:0;
      claim.forEach(d=>{lim[d.id]=Math.floor((lim[d.id]||0)*k);});
    });
    return lim;
  }
  function sectionize(host,blocks,headEl,makeItem){
    const seq=effBgSeq(blocks);
    try{window.__OVLIM__=ovLimits(blocks);}catch(e){window.__OVLIM__=null;}
    let sec=null,secIn=null,curPbg=null,lastSec=null,noPt=false;
    function openSec(pbg){
      sec=document.createElement('div');
      sec.className='sec'+(pbg?' has-bg':'')+(noPt?' no-pt':'');
      noPt=false;
      if(pbg)sec.setAttribute('style',bandCss(pbg));
      host.appendChild(sec);lastSec=sec;
      secIn=document.createElement('div');secIn.className='sec-in';sec.appendChild(secIn);
    }
    function ensure(){if(!sec)openSec(curPbg);}
    openSec(null);
    if(headEl)secIn.appendChild(headEl);
    blocks.forEach((b,i)=>{
      const p=blockPageBg(b);
      if(p&&b.type!=='spacer'){curPbg=(p&&p.type==='base')?null:p;sec=null;}
      const spCol=x=>{
        if(!x||x.type!=='spacer')return null;
        if(x.fill==='color'&&x.color)return x.color;
        if(x.box&&x.box.pageBg==='color'&&x.box.pageColor)return x.box.pageColor;
        return null;
      };
      b.__bgTop=spCol(blocks[i-1])||seq[i];
      b.__bgBot=spCol(blocks[i+1])||((i+1<blocks.length)?seq[i+1]:seq[i]);
      // photo d'un espaceur voisin, pour prolonger l'image dans le séparateur
      const spImg=x=>{
        if(!x)return null;
        if(x.type==='spacer'&&x.fill==='image'&&x.img)return x.img;
        if(x.box&&x.box.pageBg==='image'&&x.box.pageImage)return x.box.pageImage;
        return null;
      };

  function gEscRx(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  function applyGlossary(root){
    if(!glossaryEnabled())return;
    var terms=C.glossary.filter(function(g){return g.term&&g.term.trim();})
      .sort(function(a,b){return b.term.length-a.term.length;});
    if(!terms.length)return;
    var used={};
    var SKIP='a,button,input,textarea,select,h1,h2,h3,h4,h5,h6,.ie-term,.acc-head,.glossary-term,code,pre,[contenteditable]';
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
      if(n.parentElement&&n.parentElement.closest(SKIP))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    var textNodes=[];var nn;while((nn=walker.nextNode()))textNodes.push(nn);
    textNodes.forEach(function(node){
      var txt=node.nodeValue;
      for(var t=0;t<terms.length;t++){
        var g=terms[t];var key=g.term.toLowerCase();
        if(used[key])continue;
        var rx;try{rx=new RegExp('(^|[^\\p{L}\\p{N}_])('+gEscRx(g.term)+')(?![\\p{L}\\p{N}_])','iu');}
        catch(e){rx=new RegExp('(^|[^\\w])('+gEscRx(g.term)+')(?![\\w])','i');}
        var m=rx.exec(txt);
        if(!m)continue;
        used[key]=true;
        var start=m.index+m[1].length;var matched=txt.substr(start,m[2].length);
        var before=document.createTextNode(txt.slice(0,start));
        var after=document.createTextNode(txt.slice(start+matched.length));
        var btn=document.createElement('button');
        btn.className='glossary-term';btn.type='button';btn.textContent=matched;
        btn.setAttribute('aria-label',matched+' \u2013 '+T('définition'));
        btn.setAttribute('aria-expanded','false');btn.dataset.def=g.def||'';
        var parent=node.parentNode;
        parent.insertBefore(before,node);parent.insertBefore(btn,node);parent.insertBefore(after,node);
        parent.removeChild(node);
        node=after; txt=after.nodeValue;
      }
    });
    wireGlossaryTips(root);
  }

  /* ---- reprise : encodage compact de l'état ---- */
  function psB64(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

  function psPack(obj){
    var raw=new TextEncoder().encode(JSON.stringify(obj));
    if(typeof CompressionStream==='undefined')return Promise.resolve('j'+psB64(raw));
    try{
      var cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return new Response(cs).arrayBuffer().then(function(ab){return 'z'+psB64(new Uint8Array(ab));}).catch(function(){return 'j'+psB64(raw);});
    }catch(e){return Promise.resolve('j'+psB64(raw));}
  }
  function psUnpack(code){
    try{
      var kind=code.charAt(0),u=psUnB64(code.slice(1));
      if(kind==='j')return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
      if(kind!=='z'||typeof DecompressionStream==='undefined')return Promise.resolve(null);
      var ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(ds).text().then(function(t){return JSON.parse(t);}).catch(function(){return null;});
    }catch(e){return Promise.resolve(null);}
  }

    var data=[];var s=unescape(encodeURIComponent(String(text)));

    function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var dist=Math.max(Math.abs(dx),Math.abs(dy)),xx=cx+dx,yy=cy+dy;

      for(var i6=0;i6<18;i6++){var bt=(vb>>>i6)&1,a=N-11+i6%3,c=Math.floor(i6/3);set(a,c,bt);set(c,a,bt);}}

      function lines(get){for(var a=0;a<N;a++){run=1;for(var b=1;b<N;b++){if(get(a,b)===get(a,b-1)){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}}
      lines(function(a,b){return M[a][b];});lines(function(a,b){return M[b][a];});

      var pat=[true,false,true,true,true,false,true];
      function finderLike(get){for(var a=0;a<N;a++)for(var b=0;b+6<N;b++){var ok=true;for(var k=0;k<7;k++)if(get(a,b+k)!==pat[k]){ok=false;break;}

  function psQRSvg(text,label){

  }

  function mdlShade(hex,amt){
    hex=(hex||'#3a6ea5').replace('#','');
    if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
    var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    if(amt>=0){r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);}
    else{var f=1+amt;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);}
    var h=function(x){return ('0'+Math.max(0,Math.min(255,x)).toString(16)).slice(-2);};
    return '#'+h(r)+h(g)+h(b);
  }
  function mdlColor(b,idx){
    var it=b.items[idx];if(it&&it.color)return it.color;
    var base=b.accent||'#3a6ea5';var n=Math.max(1,b.items.length);
    return mdlShade(base,(idx/n)*0.55-0.15);

  function mdlReadable(hex){

    var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b)>150?'#1c1b19':'#ffffff';

  // ----- agencement sans chevauchement -----
  // ms/mk mesurent les bulles (satellites / sous-idées), cS est la taille du centre.
  // Les nœuds doivent porter _kids (sous-idées déjà filtrées).
  // ----- agencement sans chevauchement -----
  // ms/mk mesurent les bulles (satellites / sous-idées), cS est la taille du centre.
  // Les nœuds doivent porter _kids (sous-idées déjà filtrées).
  // Les sous-idées sont empilées perpendiculairement à leur branche, avec un pas
  // calculé sur la taille réelle des bulles, et le rayon principal s'agrandit tant
  // que la pile d'une branche ne tient pas dans son secteur.
  function mmCalc(nodes,ms,mk,cS){
    var n=Math.max(1,nodes.length);
    var satS=nodes.map(ms);
    var maxSW=80,maxSH=30;
    satS.forEach(function(s){if(s.w>maxSW)maxSW=s.w;if(s.h>maxSH)maxSH=s.h;});
    // rayon principal : les satellites ne se touchent ni entre eux ni avec le centre
    var R=150;
    if(n>1)R=Math.max(R,(maxSW*0.9+22)/(2*Math.sin(Math.PI/n)));
    R=Math.max(R,cS.w/2+maxSW/2+46,cS.h/2+maxSH/2+46);
    // préparation des branches
    var br=[];
    nodes.forEach(function(nd,i){
      var kids=nd._kids||[];
      if(!kids.length){br.push(null);return;}
      var a=(i/n)*2*Math.PI-Math.PI/2;
      var ox=Math.cos(a),oy=Math.sin(a),px=-oy,py=ox;
      var ks=kids.map(mk);
      var kw=40,kh=22;
      ks.forEach(function(sz){if(sz.w>kw)kw=sz.w;if(sz.h>kh)kh=sz.h;});
      // pas entre sous-idées le long de la perpendiculaire : il suffit qu'un axe sépare
      var d=Math.min((kw+12)/Math.max(Math.abs(px),0.15),(kh+12)/Math.max(Math.abs(py),0.15));
      var L=(kids.length-1)*d;
      // distance branche -> pile : un axe doit séparer du satellite, même pour la
      // sous-idée la plus décalée le long de la perpendiculaire
      var cR=Math.min(
        (satS[i].w/2+kw/2+26+(L/2)*Math.abs(px))/Math.max(Math.abs(ox),0.2),
        (satS[i].h/2+kh/2+26+(L/2)*Math.abs(py))/Math.max(Math.abs(oy),0.2));
      cR=Math.max(64,Math.min(cR,420));
      br.push({ks:ks,ox:ox,oy:oy,px:px,py:py,d:d,cR:cR,L:L,kw:kw});
      // écarter tout le monde si la pile déborde de son secteur
      if(n>1){
        var needR=(L/2+kw/2+12)/Math.sin(Math.PI/n)-cR*0.9;
        if(needR>R)R=needR;
      }
    });
    var pts=[],i;
    for(i=0;i<n;i++){var a2=(i/n)*2*Math.PI-Math.PI/2;pts.push([Math.cos(a2)*R,Math.sin(a2)*R,a2]);}
    // positions des sous-idées + bornes du dessin
    var minX=-cS.w/2,maxX=cS.w/2,minY=-cS.h/2,maxY=cS.h/2;
    function grow(x,y,w,h){if(x-w/2<minX)minX=x-w/2;if(x+w/2>maxX)maxX=x+w/2;if(y-h/2<minY)minY=y-h/2;if(y+h/2>maxY)maxY=y+h/2;}
    nodes.forEach(function(nd,i2){grow(pts[i2][0],pts[i2][1],satS[i2].w,satS[i2].h);});
    var kidPos=[];
    nodes.forEach(function(nd,i2){
      var g=br[i2];if(!g){kidPos.push(null);return;}
      var k=g.ks.length,arr=[];
      g.ks.forEach(function(sz,ki){
        var off=(ki-(k-1)/2)*g.d;
        var x=pts[i2][0]+g.ox*g.cR+g.px*off,y=pts[i2][1]+g.oy*g.cR+g.py*off;
        arr.push({x:x,y:y,s:sz});grow(x,y,sz.w,sz.h);
      });
      kidPos.push(arr);
    });
    var pad=16;
    return {pts:pts,satS:satS,kidPos:kidPos,vb:{x:minX-pad,y:minY-pad,w:(maxX-minX)+pad*2,h:(maxY-minY)+pad*2}};
  }

  // ===== CARTE MENTALE À REMPLIR (réflexion) =====
  /* Decoupe un libelle d'axe en plusieurs lignes pour qu'il tienne dans le
     cadre du radar (viewBox 320). La largeur disponible depend du cote ou se
     trouve l'axe. On plafonne a 3 lignes pour ne pas empieter sur le dessin. */
  function radarLines(txt,x,anchor,fs){
    var avg=fs*0.55,pad=8,LX=-70,RX=390;
    var avail=(anchor==='start')?(RX-x-pad):((anchor==='end')?(x-LX-pad):(Math.min(x-LX,RX-x)*2-pad));
    var maxc=Math.max(7,Math.floor(avail/avg));
    var words=String(txt||'').split(/\s+/).filter(Boolean),lines=[],cur='';
    words.forEach(function(w){
      while(w.length>maxc){
        if(cur){lines.push(cur);cur='';}
        lines.push(w.slice(0,maxc));w=w.slice(maxc);
      }
      var t=cur?cur+' '+w:w;
      if(t.length<=maxc)cur=t;else{if(cur)lines.push(cur);cur=w;}
    });
    if(cur)lines.push(cur);
    if(!lines.length)lines=[String(txt||'')];
    if(lines.length>3){lines=lines.slice(0,3);lines[2]=lines[2].replace(/.{1}$/,'')+'\u2026';}
    return lines;
  }
  function radarGeom(axes,max,vals,R0){
    var n=axes.length,C=160,pts=[],grid=[],lab=[];
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+i*2*Math.PI/n;
      var vx=C+Math.cos(a)*R0, vy=C+Math.sin(a)*R0;
      grid.push([vx,vy]);
      var v=Math.max(0,Math.min(max,vals[i]||0));
      pts.push([C+Math.cos(a)*R0*(v/max), C+Math.sin(a)*R0*(v/max)]);
      var lx=C+Math.cos(a)*(R0+22), ly=C+Math.sin(a)*(R0+22);
      var an=(Math.abs(Math.cos(a))<0.25)?'middle':(Math.cos(a)>0?'start':'end');
      lab.push({x:lx,y:ly+4,anchor:an});
    }
    return {pts:pts,grid:grid,lab:lab,C:C};
  }

    var poly=g.pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');

      // liens principaux

      ce.style.left=L(0);ce.style.top=Tp(0);
      ce.oninput=function(){data.center=ce.textContent;save();};
      ce.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();ce.blur();}});
      ce.addEventListener('paste',function(e){e.preventDefault();var t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\s+/g,' ');document.execCommand('insertText',false,t);});

        wrapN.appendChild(inp);wrapN.appendChild(sub);wrapN.appendChild(del);overlay.appendChild(wrapN);
      });
      // sous-branches éditables
      data.nodes.forEach(function(nd,i){

          var wrapK=document.createElement('div');wrapK.className='mmr-node mmr-knode';

          kinp.oninput=function(){kd.label=kinp.textContent;save();};
