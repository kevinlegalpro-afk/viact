  function buildModel(b){
    var wrap=document.createElement('div');wrap.className='model-block';
    var items=(b.items||[]).filter(function(it){return (it.label&&it.label.trim())||(it.desc&&it.desc.trim());});
    if(b.title){var h=document.createElement('div');h.className='model-title';h.textContent=b.title;wrap.appendChild(h);}
    var stage=document.createElement('div');stage.className='model-stage';wrap.appendChild(stage);
    var detail=document.createElement('div');detail.className='model-detail';detail.setAttribute('aria-live','polite');detail.style.display='none';wrap.appendChild(detail);
    if(!items.length){wrap.innerHTML='<p class="model-empty">'+T('Aucun élément défini.')+'</p>';return wrap;}
    function showDetail(idx){
      var it=items[idx];
      if(!it.desc||!it.desc.trim()){detail.style.display='none';return;}
      detail.style.display='';
      detail.innerHTML='<span class="md-dot" style="background:'+mdlColor(b,idx)+'"></span><span class="md-lab">'+E(it.label||'')+'</span><span class="md-desc">'+E(it.desc)+'</span>';
    }
    var svg;
    var kind=b.kind||'cycle';
    if(kind==='cycle')svg=mdlCycle(b,items,showDetail);
    else if(kind==='pyramid')svg=mdlPyramid(b,items,showDetail);
    else if(kind==='quadrant')svg=mdlQuadrant(b,items,showDetail);
    else if(kind==='onion')svg=mdlOnion(b,items,showDetail);
    else if(kind==='venn')svg=mdlVenn(b,items,showDetail);
    else if(kind==='funnel')svg=mdlFunnel(b,items,showDetail);
    else if(kind==='iceberg')svg=mdlIceberg(b,items,showDetail);
    else if(kind==='stairs')svg=mdlStairs(b,items,showDetail);
    else if(kind==='gears')svg=mdlGears(b,items,showDetail);
    else svg=mdlCycle(b,items,showDetail);
    stage.appendChild(svg);
    return wrap;
  }
  function mdlSvg(vb){
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox',vb);svg.setAttribute('class','model-svg');svg.setAttribute('role','group');
    return svg;
  }
  function mdlNode(tag,attrs){
    var el=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(var k in attrs)el.setAttribute(k,attrs[k]);
    return el;
  }
  function mdlClickable(el,idx,items,cb){
    el.setAttribute('tabindex','0');el.setAttribute('role','button');
    var it=items[idx];
    el.setAttribute('aria-label',(it.label||'')+(it.desc?' : '+it.desc:''));
    el.style.cursor=it.desc&&it.desc.trim()?'pointer':'default';
    el.classList.add('mdl-hit');
    function act(){cb(idx);
      var p=el.ownerSVGElement||el.closest('svg');
      if(p)p.querySelectorAll('.mdl-active').forEach(function(x){x.classList.remove('mdl-active');});
      el.classList.add('mdl-active');
    }
    el.addEventListener('click',act);
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  }
  function mdlWrapText(txt,max){
    txt=(txt||'').trim();if(!txt)return [];
    var words=txt.split(/\s+/),lines=[],cur='';
    for(var i=0;i<words.length;i++){
      var t=cur?cur+' '+words[i]:words[i];
      if(t.length>max&&cur){lines.push(cur);cur=words[i];}else cur=t;
    }
    if(cur)lines.push(cur);
    return lines.slice(0,3);
  }
  function mdlLabel(svg,x,y,txt,color,max,size,halo){
    var lines=mdlWrapText(txt,max||16);
    var attrs={x:x,y:y,'text-anchor':'middle','dominant-baseline':'middle',fill:color||'#fff','font-size':(size||13),'font-weight':600,'pointer-events':'none'};
    if(halo){
      // contour de la couleur opposée pour rester lisible sur tout fond
      var hc=(color==='#ffffff'||color==='#fff')?'rgba(0,0,0,.55)':'rgba(255,255,255,.85)';
      attrs.stroke=hc;attrs['stroke-width']=3.2;attrs['paint-order']='stroke';attrs['stroke-linejoin']='round';
    }
    var t=mdlNode('text',attrs);
    t.setAttribute('class','mdl-txt');
    var off=-(lines.length-1)*0.6;
    lines.forEach(function(ln,i){
      var ts=mdlNode('tspan',{x:x,dy:(i===0?off+'em':'1.2em')});ts.textContent=ln;t.appendChild(ts);
    });
    svg.appendChild(t);
  }

  // --- CYCLE : flèches en anneau ---
  function mdlCycle(b,items,cb){
    var svg=mdlSvg('0 0 400 400');var cx=200,cy=200,R=150,n=items.length;
    var gap=0.13; // espace entre segments (radians)
    for(var i=0;i<n;i++){
      var a0=(i/n)*2*Math.PI - Math.PI/2 + gap/2;
      var a1=((i+1)/n)*2*Math.PI - Math.PI/2 - gap/2;
      var col=mdlColor(b,i);
      var seg=mdlArrowSeg(cx,cy,R,58,a0,a1);
      var path=mdlNode('path',{d:seg.d,fill:col});
      mdlClickable(path,i,items,cb);
      svg.appendChild(path);
      var mid=(a0+a1)/2;var lr=R-29;
      /* La place disponible depend de l'orientation du segment : en haut et
         en bas le texte suit l'arc (large), a gauche et a droite il traverse
         la bande (etroit, 58 unites). On adapte la coupure, et on pose un
         contour pour rester lisible si un mot deborde malgre tout. */
      var arc=Math.max(58,(2*Math.PI*lr)/n-18);
      var horiz=Math.abs(Math.cos(mid));
      var avail=58+(arc-58)*(1-horiz);
      var maxc=Math.max(6,Math.round(avail/(12*0.58)));
      mdlLabel(svg,cx+Math.cos(mid)*lr,cy+Math.sin(mid)*lr,items[i].label,mdlReadable(col),maxc,12,true);
    }
    return svg;
  }
  function mdlArrowSeg(cx,cy,R,w,a0,a1){
    var rO=R,rI=R-w;var head=0.10;var aHead=a1-head;
    function pt(r,a){return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
    var pO0=pt(rO,a0),pI0=pt(rI,a0),pOh=pt(rO,aHead),pIh=pt(rI,aHead),tip=pt((rO+rI)/2,a1);
    var large=0;
    var d='M'+pO0[0]+','+pO0[1]+
      ' A'+rO+','+rO+' 0 '+large+' 1 '+pOh[0]+','+pOh[1]+
      ' L'+tip[0]+','+tip[1]+
      ' L'+pIh[0]+','+pIh[1]+
      ' A'+rI+','+rI+' 0 '+large+' 0 '+pI0[0]+','+pI0[1]+' Z';
    return {d:d};
  }

  // --- PYRAMIDE ---
  function mdlPyramid(b,items,cb){
    var n=items.length,W=300,H=290,x0=50,y0=20;
    var svg=mdlSvg('0 0 460 330');
    var apexX=x0+W/2;
    for(var i=0;i<n;i++){
      var yT=y0+(i/n)*H, yB=y0+((i+1)/n)*H;
      var wT=(i/n)*W, wB=((i+1)/n)*W;
      var xTl=apexX-wT/2,xTr=apexX+wT/2,xBl=apexX-wB/2,xBr=apexX+wB/2;
      var col=mdlColor(b,i);
      var d='M'+xTl+','+yT+' L'+xTr+','+yT+' L'+xBr+','+yB+' L'+xBl+','+yB+' Z';
      if(i===0)d='M'+apexX+','+yT+' L'+xBr+','+yB+' L'+xBl+','+yB+' Z';
      var path=mdlNode('path',{d:d,fill:col,stroke:'#fff','stroke-width':2});
      mdlClickable(path,i,items,cb);svg.appendChild(path);
      var midY=(yT+yB)/2;
      var lab=items[i].label||'';
      // largeur dispo (au bas du niveau) ; si trop étroit pour le texte, déporter à droite avec trait
      var avail=wB-8;
      var needed=lab.length*(11*0.56);
      if(needed>avail && lab){
        var lineEndX=xTr+6, calloutX=x0+W+18;
        svg.appendChild(mdlNode('line',{x1:apexX,y1:midY,x2:calloutX-6,y2:midY,stroke:col,'stroke-width':1.5,'stroke-dasharray':'2 3'}));
        var t=mdlNode('text',{x:calloutX,y:midY,'text-anchor':'start','dominant-baseline':'middle',fill:'var(--c-ink,#1c1b19)','font-size':12,'font-weight':600,'pointer-events':'none'});
        t.setAttribute('class','mdl-txt');t.textContent=lab;svg.appendChild(t);
      } else {
        mdlLabel(svg,apexX,midY,lab,mdlReadable(col),Math.max(9,Math.round(wB/8)),12,true);
      }
    }
    return svg;
  }

  // --- QUADRANTS ---
  function mdlQuadrant(b,items,cb){
    var m=70,S=320,half=S/2;
    var svg=mdlSvg('0 0 460 460');
    var cx=m+half,cy=m+half;
    var pos=[[m,m],[m+half,m],[m,m+half],[m+half,m+half]];
    for(var i=0;i<4;i++){
      var col=mdlColor(b,i);
      var rect=mdlNode('rect',{x:pos[i][0]+2,y:pos[i][1]+2,width:half-4,height:half-4,rx:8,fill:col,opacity:0.92});
      mdlClickable(rect,i,items,cb);svg.appendChild(rect);
      mdlLabel(svg,pos[i][0]+half/2,pos[i][1]+half/2,items[i].label,mdlReadable(col),14,13,true);
    }
    // axes
    svg.appendChild(mdlNode('line',{x1:cx,y1:m-14,x2:cx,y2:m+S+14,stroke:'#94908a','stroke-width':2}));
    svg.appendChild(mdlNode('line',{x1:m-14,y1:cy,x2:m+S+14,y2:cy,stroke:'#94908a','stroke-width':2}));
    // flèches d'axes
    [[cx,m-14,'up'],[cx,m+S+14,'down'],[m-14,cy,'left'],[m+S+14,cy,'right']].forEach(function(a){
      var x=a[0],y=a[1],dir=a[2],ar;
      if(dir==='up')ar='M'+x+','+(y-7)+' L'+(x-5)+','+(y+2)+' L'+(x+5)+','+(y+2)+' Z';
      else if(dir==='down')ar='M'+x+','+(y+7)+' L'+(x-5)+','+(y-2)+' L'+(x+5)+','+(y-2)+' Z';
      else if(dir==='left')ar='M'+(x-7)+','+y+' L'+(x+2)+','+(y-5)+' L'+(x+2)+','+(y+5)+' Z';
      else ar='M'+(x+7)+','+y+' L'+(x-2)+','+(y-5)+' L'+(x-2)+','+(y+5)+' Z';
      svg.appendChild(mdlNode('path',{d:ar,fill:'#94908a'}));
    });
    // libellés d'axes
    function axLabel(x,y,txt,anchor,rot){
      if(!txt||!txt.trim())return;
      var t=mdlNode('text',{x:x,y:y,'text-anchor':anchor||'middle','dominant-baseline':'middle',fill:'var(--c-ink,#1c1b19)','font-size':13,'font-weight':700,'pointer-events':'none'});
      t.setAttribute('class','mdl-txt');
      if(rot)t.setAttribute('transform','rotate('+rot+' '+x+' '+y+')');
      t.textContent=txt;svg.appendChild(t);
    }
    axLabel(cx,m-30,b.axisTop,'middle');
    axLabel(cx,m+S+34,b.axisBottom,'middle');
    axLabel(m-34,cy,b.axisLeft,'middle',-90);
    axLabel(m+S+34,cy,b.axisRight,'middle',90);
    return svg;
  }

  // --- CERCLES CONCENTRIQUES (oignon) ---
  function mdlOnion(b,items,cb){
    var svg=mdlSvg('0 0 400 400');var cx=200,cy=200,Rmax=180,n=items.length;
    for(var i=n-1;i>=0;i--){
      var r=Rmax*((i+1)/n);
      var col=mdlColor(b,i);
      var c=mdlNode('circle',{cx:cx,cy:cy,r:r,fill:col,stroke:'#fff','stroke-width':2});
      mdlClickable(c,i,items,cb);svg.appendChild(c);
      var ringMid=(i===0)?0:Rmax*((i+0.5)/n);
      mdlLabel(svg,cx,cy-ringMid,items[i].label,mdlReadable(col),16,12);
    }
    return svg;
  }

  // --- VENN ---
  function mdlVenn(b,items,cb){
    var svg=mdlSvg('0 0 400 380');var n=items.length;var C=[200,190];
    // configurations équilibrées et centrées
    var conf={
      2:[[148,190,100],[252,190,100]],
      3:[[200,132,96],[144,236,96],[256,236,96]],
      4:[[152,150,88],[248,150,88],[120,244,88],[280,244,88]]
    };
    var cc=conf[n]||conf[3];
    // cercles
    for(var i=0;i<n;i++){
      var col=mdlColor(b,i);
      var c=mdlNode('circle',{cx:cc[i][0],cy:cc[i][1],r:cc[i][2],fill:col,opacity:0.45,stroke:col,'stroke-width':2.5});
      c.style.mixBlendMode='multiply';
      mdlClickable(c,i,items,cb);svg.appendChild(c);
    }
    // labels des cercles, poussés vers l'extérieur
    for(var j=0;j<n;j++){
      var dx=cc[j][0]-C[0],dy=cc[j][1]-C[1];var dl=Math.sqrt(dx*dx+dy*dy)||1;
      var lx=cc[j][0]+dx/dl*(cc[j][2]*0.62),ly=cc[j][1]+dy/dl*(cc[j][2]*0.62);
      if(dl<1){lx=cc[j][0];ly=cc[j][1]-cc[j][2]*0.5;}
      mdlLabel(svg,lx,ly,items[j].label,'var(--c-ink,#1c1b19)',13,12);
    }
    // intersections : milieu entre chaque paire de cercles
    b.crosses=b.crosses||{};
    var pairs=[];
    for(var a=0;a<n;a++)for(var bb=a+1;bb<n;bb++)pairs.push([a,bb]);
    // centre commun (toutes) pour 3
    var interPts=[];
    pairs.forEach(function(pr){
      var mx=(cc[pr[0]][0]+cc[pr[1]][0])/2,my=(cc[pr[0]][1]+cc[pr[1]][1])/2;
      interPts.push({key:pr[0]+'-'+pr[1],x:mx,y:my});
    });
    if(n===3){interPts.push({key:'0-1-2',x:(cc[0][0]+cc[1][0]+cc[2][0])/3,y:(cc[0][1]+cc[1][1]+cc[2][1])/3});}
    interPts.forEach(function(ip){
      var g=mdlNode('g',{});
      var plus=mdlNode('text',{x:ip.x,y:ip.y,'text-anchor':'middle','dominant-baseline':'middle',fill:'var(--c-ink,#1c1b19)','font-size':18,'font-weight':800,'pointer-events':'none'});
      plus.setAttribute('class','mdl-txt');
      var txt=b.crosses[ip.key]||'';
      plus.textContent=txt?'':'+';
      // zone cliquable invisible
      var hot=mdlNode('circle',{cx:ip.x,cy:ip.y,r:22,fill:'transparent'});
      hot.setAttribute('class','mdl-hit');hot.setAttribute('tabindex','0');hot.setAttribute('role','button');
      hot.style.cursor='pointer';
      hot.setAttribute('aria-label',txt||T('Intersection'));
      if(txt){
        mdlLabel(svg,ip.x,ip.y,txt,'var(--c-ink,#1c1b19)',10,10);
      }
      hot.addEventListener('click',function(){showVennCross(b,ip.key,items);});
      hot.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showVennCross(b,ip.key,items);}});
      svg.appendChild(plus);svg.appendChild(hot);
    });
    return svg;
  }
  function showVennCross(b,key,items){
    var wrap=event&&event.target?event.target.closest('.model-block'):null;
    if(!wrap)return;
    var detail=wrap.querySelector('.model-detail');if(!detail)return;
    var txt=(b.crosses&&b.crosses[key])||'';
    var names=key.split('-').map(function(idx){return (items[+idx]&&items[+idx].label)||'';}).filter(Boolean).join(' ∩ ');
    detail.style.display='';
    detail.innerHTML='<span class="md-lab">'+E(names)+'</span><span class="md-desc">'+(txt?E(txt):T('Aucune précision pour cette intersection.'))+'</span>';
  }

  // --- ENTONNOIR ---
  function mdlFunnel(b,items,cb){
    var svg=mdlSvg('0 0 400 340');var n=items.length,W=320,H=280,x0=40,y0=20;
    var cx=x0+W/2;var minW=70;
    for(var i=0;i<n;i++){
      var yT=y0+(i/n)*H,yB=y0+((i+1)/n)*H;
      var wT=W-(W-minW)*(i/n),wB=W-(W-minW)*((i+1)/n);
      var col=mdlColor(b,i);
      var d='M'+(cx-wT/2)+','+yT+' L'+(cx+wT/2)+','+yT+' L'+(cx+wB/2)+','+yB+' L'+(cx-wB/2)+','+yB+' Z';
      var path=mdlNode('path',{d:d,fill:col,stroke:'#fff','stroke-width':2});
      mdlClickable(path,i,items,cb);svg.appendChild(path);
      mdlLabel(svg,cx,(yT+yB)/2,items[i].label,mdlReadable(col),18,13);
    }
    return svg;
  }

  // --- ICEBERG ---
  function mdlIceberg(b,items,cb){
    var svg=mdlSvg('0 0 460 420');
    var cx=210, waterY=140, topY=24, botY=390;
    // eau
    svg.appendChild(mdlNode('rect',{x:0,y:waterY,width:420,height:botY-waterY+20,fill:'#cfe4f2',opacity:0.45,rx:0}));
    svg.appendChild(mdlNode('line',{x1:0,y1:waterY,x2:420,y2:waterY,stroke:'#5b8bb0','stroke-width':2,'stroke-dasharray':'7 4'}));
    var n=items.length;
    var nVis=Math.max(1,Math.round(n*0.3));
    var halfTopW=64;     // demi-largeur à la ligne d'eau
    var halfBotW=150;    // demi-largeur max en bas
    // largeur de l'iceberg à une hauteur y
    function halfW(y){
      if(y<=waterY){ // partie émergée : pointe en haut -> ligne d'eau
        var f=(y-topY)/(waterY-topY);return f*halfTopW;
      } else { // partie immergée : s'élargit puis se resserre vers le bas
        var f=(y-waterY)/(botY-waterY);
        // largeur : part de halfTopW, gonfle jusqu'à halfBotW à ~70%, puis pointe
        var w=halfTopW+(halfBotW-halfTopW)*Math.sin(Math.min(1,f/0.72)*Math.PI/2);
        if(f>0.72){var g=(f-0.72)/0.28;w=w*(1-g);}
        return w;
      }
    }
    // silhouette complète de l'iceberg (émergé + immergé) en deux polygones
    function buildPoly(y0,y1,steps){
      var L=[],Rr=[];
      for(var k=0;k<=steps;k++){var y=y0+(y1-y0)*k/steps;var hw=halfW(y);L.push([cx-hw,y]);Rr.push([cx+hw,y]);}
      var d='M'+L[0][0]+','+L[0][1];
      for(var a=1;a<L.length;a++)d+=' L'+L[a][0]+','+L[a][1];
      for(var c=Rr.length-1;c>=0;c--)d+=' L'+Rr[c][0]+','+Rr[c][1];
      return d+' Z';
    }
    // silhouette complète pour découpe : les mots ne déborderont pas
    var clipId='ice-clip-'+(b.id||Math.random().toString(36).slice(2,7));
    var defs=mdlNode('defs',{});
    var clip=mdlNode('clipPath',{id:clipId});
    var silh=mdlNode('path',{d:buildPoly(topY,botY,24)});
    clip.appendChild(silh);defs.appendChild(clip);svg.appendChild(defs);
    // groupe des mots, découpé par la silhouette
    var wordsG=mdlNode('g',{'clip-path':'url(#'+clipId+')'});
    // bandes par niveau
    var visH=(waterY-topY), subH=(botY-waterY);
    for(var idx=0;idx<n;idx++){
      var isVis=idx<nVis;
      var col=mdlColor(b,idx);
      var yT,yB;
      if(isVis){var seg=visH/nVis;yT=topY+idx*seg;yB=topY+(idx+1)*seg;}
      else{var nSub=n-nVis,kk=idx-nVis,seg2=subH/nSub;yT=waterY+kk*seg2;yB=waterY+(kk+1)*seg2;}
      var d=buildPoly(yT,yB,10);
      var path=mdlNode('path',{d:d,fill:col,stroke:'#fff','stroke-width':1.5,opacity:isVis?1:0.92});
      mdlClickable(path,idx,items,cb);svg.appendChild(path);
      // MOTS répartis dans la bande sans superposition ni débordement
      var words=(items[idx].desc||'').split(/[,;\n]+/).map(function(w){return w.trim();}).filter(Boolean);
      var tc=mdlReadable(col);
      if(words.length){
        var rows=Math.ceil(Math.sqrt(words.length));
        var perRow=Math.ceil(words.length/rows);
        var wi=0;
        for(var r=0;r<rows && wi<words.length;r++){
          var cntThis=Math.min(perRow,words.length-wi);
          var ry=yT+(yB-yT)*((r+1)/(rows+1));
          var hw2=halfW(ry)*0.84;              // largeur utile de la bande à cette hauteur
          var slotW=(2*hw2)/cntThis;           // largeur disponible par mot
          for(var cIdx=0;cIdx<cntThis;cIdx++){
            var wx=cx + (cntThis===1?0:(-hw2+slotW*(cIdx+0.5)));
            var word=words[wi];
            // taille de police adaptée à la place : on rétrécit si le mot est long
            var fs=11;
            var estW=word.length*fs*0.55;       // largeur estimée du texte
            if(estW>slotW-4){fs=Math.max(7,Math.floor((slotW-4)/(word.length*0.55)));}
            var wt=mdlNode('text',{x:wx,y:ry,'text-anchor':'middle','dominant-baseline':'middle',fill:tc,'font-size':fs,'font-weight':600,'pointer-events':'none'});
            wt.setAttribute('class','mdl-txt');
            // découpe la longueur au strict nécessaire si vraiment trop étroit
            var maxChars=Math.max(3,Math.floor((slotW-2)/(fs*0.55)));
            wt.textContent=word.length>maxChars?word.slice(0,maxChars-1)+'…':word;
            if(word.length>maxChars){var tt=mdlNode('title',{});tt.textContent=word;wt.appendChild(tt);}
            wordsG.appendChild(wt);
            wi++;
          }
        }
      }
      // NOM du niveau hors iceberg (à droite, trait de rappel)
      if(items[idx].label && items[idx].label.trim()){
        var midY=(yT+yB)/2;var edge=cx+halfW(midY);var calloutX=380;
        svg.appendChild(mdlNode('line',{x1:edge+2,y1:midY,x2:calloutX-6,y2:midY,stroke:col,'stroke-width':1.4,'stroke-dasharray':'2 3'}));
        var lt=mdlNode('text',{x:calloutX,y:midY,'text-anchor':'start','dominant-baseline':'middle',fill:'var(--c-ink,#1c1b19)','font-size':12.5,'font-weight':700,'pointer-events':'none'});
        lt.setAttribute('class','mdl-txt');lt.textContent=items[idx].label;svg.appendChild(lt);
      }
    }
    svg.appendChild(wordsG);
    // étiquettes eau
    var av=mdlNode('text',{x:14,y:waterY-8,'text-anchor':'start',fill:'#5b8bb0','font-size':11,'font-style':'italic','pointer-events':'none'});av.textContent=T('Visible');svg.appendChild(av);
    var bv=mdlNode('text',{x:14,y:waterY+16,'text-anchor':'start',fill:'#5b8bb0','font-size':11,'font-style':'italic','pointer-events':'none'});bv.textContent=T('Immergé');svg.appendChild(bv);
    return svg;
  }

  // --- ESCALIER ---
  function mdlStairs(b,items,cb){
    var n=items.length;
    var svg=mdlSvg('0 0 460 360');
    var x0=30,y0=330,W=400,H=300;
    var stepW=W/n, stepH=H/n;
    for(var i=0;i<n;i++){
      var col=mdlColor(b,i);
      // marche i : montée progressive de gauche (base) à droite (sommet)
      var bx=x0+i*stepW, by=y0-(i+1)*stepH;
      var d='M'+bx+','+by+' L'+(bx+stepW)+','+by+' L'+(bx+stepW)+','+y0+' L'+bx+','+y0+' Z';
      var path=mdlNode('path',{d:d,fill:col,stroke:'#fff','stroke-width':2});
      mdlClickable(path,i,items,cb);svg.appendChild(path);
      // face avant (petit effet 3D) : bandeau plus foncé en haut de la marche
      svg.appendChild(mdlNode('rect',{x:bx,y:by,width:stepW,height:8,fill:'rgba(0,0,0,.12)','pointer-events':'none'}));
      mdlLabel(svg,bx+stepW/2,by+stepH/2+4,items[i].label,mdlReadable(col),Math.max(9,Math.round(stepW/7)),12,true);
    }
    // flèche de progression
    svg.appendChild(mdlNode('path',{d:'M'+(x0-4)+','+(y0+16)+' L'+(x0+W)+','+(y0+16-H+8),stroke:'#94908a','stroke-width':2,fill:'none','stroke-dasharray':'5 4','marker-end':''}));
    return svg;
  }

  // --- ENGRENAGES ---
  function mdlGearPath(r,teeth){
    // engrenage centré sur (0,0), dents trapézoïdales régulières
    var rO=r, rP=r*0.82, rRoot=r*0.72;
    var d='';
    var per=2*Math.PI/teeth;
    for(var t=0;t<teeth;t++){
      var a0=t*per;
      // 4 angles : creux début, montée, plat dent, descente
      var aA=a0, aB=a0+per*0.30, aC=a0+per*0.50, aD=a0+per*0.70, aE=a0+per;
      function P(ang,rr){return (Math.cos(ang)*rr).toFixed(2)+','+(Math.sin(ang)*rr).toFixed(2);}
      if(t===0)d+='M'+P(aA,rRoot);
      d+=' L'+P(aA,rRoot);
      d+=' L'+P(aB,rP);          // flanc montant
      d+=' L'+P(aB,rO);
      d+=' L'+P(aC,rO);          // sommet dent (plat)
      d+=' L'+P(aD,rO);
      d+=' L'+P(aD,rP);          // flanc descendant
      d+=' L'+P(aE,rRoot);       // creux
    }
    return d+' Z';
  }
  function mdlGears(b,items,cb){
    var n=items.length;
    var svg=mdlSvg('0 0 480 360');
    // rayons décroissants ; les centres sont placés pour que les dents s'engrènent
    // (distance entre centres ~ somme des rayons primitifs)
    var teeth=[12,10,11,9];
    var radii=[70,58,54,48];
    // positions : chaîne d'engrenages qui se touchent, en zig-zag doux
    var centers=[];
    var margin=90;
    if(n===2){
      centers=[[margin+radii[0], 180],[margin+radii[0]+radii[0]*0.82+radii[1]*0.82, 180]];
    } else if(n===3){
      var c0=[150,150];
      var d01=radii[0]*0.82+radii[1]*0.82;
      var c1=[c0[0]+d01*Math.cos(-0.35), c0[1]+d01*Math.sin(-0.35)];
      var d12=radii[1]*0.82+radii[2]*0.82;
      var c2=[c1[0]+d12*Math.cos(1.15), c1[1]+d12*Math.sin(1.15)];
      centers=[c0,c1,c2];
    } else {
      var b0=[160,160];
      var dd=function(a,c){return radii[a]*0.82+radii[c]*0.82;};
      var b1=[b0[0]+dd(0,1)*Math.cos(-0.30), b0[1]+dd(0,1)*Math.sin(-0.30)];
      var b2=[b0[0]+dd(0,2)*Math.cos(1.05), b0[1]+dd(0,2)*Math.sin(1.05)];
      var b3=[b1[0]+dd(1,3)*Math.cos(1.15), b1[1]+dd(1,3)*Math.sin(1.15)];
      centers=[b0,b1,b2,b3];
    }
    for(var i=0;i<n;i++){
      var col=mdlColor(b,i);
      var cxy=centers[i];var r=radii[i];
      var g=mdlNode('g',{transform:'translate('+cxy[0].toFixed(1)+','+cxy[1].toFixed(1)+')'});
      var path=mdlNode('path',{d:mdlGearPath(r,teeth[i]),fill:col,stroke:mdlShade(col,-0.15),'stroke-width':1});
      path.setAttribute('class','mdl-gear');
      // sens alterné, même vitesse angulaire de contact (dents/temps) -> durée proportionnelle au nb de dents
      var dur=(teeth[i]*0.9).toFixed(1);
      path.style.animation='mdlspin'+(i%2?'rev':'')+' '+dur+'s linear infinite';
      mdlClickable(path,i,items,cb);g.appendChild(path);
      // moyeu
      g.appendChild(mdlNode('circle',{cx:0,cy:0,r:r*0.34,fill:'rgba(255,255,255,.55)','pointer-events':'none'}));
      g.appendChild(mdlNode('circle',{cx:0,cy:0,r:r*0.14,fill:mdlShade(col,-0.2),'pointer-events':'none'}));
      svg.appendChild(g);
      // label centré dans le moyeu
      mdlLabel(svg,cxy[0],cxy[1],items[i].label,mdlReadable(col),Math.max(9,Math.round(r/5)),11,true);
    }
    return svg;
  }

    function buildInteractiveVideo(b){
    var isQ=b.type==='videoquiz';
    var wrap=document.createElement('div');wrap.className='ivideo';
    var stops=(b.stops||[]).filter(function(st){return (st.q&&st.q.trim())||( st.options&&st.options.length);}).slice().sort(function(a,c){return (+a.t||0)-(+c.t||0);});
    if(!b.url){wrap.innerHTML='<p class="ivideo-empty">'+T('Aucune vidéo définie.')+'</p>';return wrap;}
    var done={};
    var stage=document.createElement('div');stage.className='ivideo-stage';wrap.appendChild(stage);
    var overlay=document.createElement('div');overlay.className='ivideo-overlay';overlay.style.display='none';wrap.appendChild(overlay);
    if(b.caption){var cap=document.createElement('figcaption');cap.className='ivideo-cap';cap.textContent=b.caption;wrap.appendChild(cap);}

    var isFile=/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(b.url)||/^data:video\//i.test(b.url);
    var yt=b.url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/);

    function showStop(st,resume){
      overlay.style.display='';
      overlay.innerHTML='';
      var card=document.createElement('div');card.className='ivo-card';
      var qh=document.createElement('div');qh.className='ivo-q';qh.textContent=st.q||(isQ?T('Question'):T('Réflexion'));
      card.appendChild(qh);
      if(isQ){
        var opts=(st.options||[]).filter(function(o){return o.text&&o.text.trim();});
        var fb=document.createElement('div');fb.className='ivo-fb';fb.setAttribute('aria-live','polite');
        var answered=false;
        opts.forEach(function(op){
          var ob=document.createElement('button');ob.className='ivo-opt';ob.textContent=op.text;
          ob.onclick=function(){
            if(answered&&op.correct===false&&st.block!==false)return;
            if(op.correct){ob.classList.add('good');fb.className='ivo-fb ok';fb.textContent=T('Correct !');
              answered=true;
              setTimeout(function(){overlay.style.display='none';resume();},700);
            } else {
              ob.classList.add('bad');fb.className='ivo-fb bad';
              fb.textContent=st.block===false?T('À revoir.'):T('Essayez encore.');
              if(st.block===false){answered=true;setTimeout(function(){overlay.style.display='none';resume();},900);}
            }
          };
          card.appendChild(ob);
        });
        card.appendChild(fb);
      } else {
        var ta=document.createElement('textarea');ta.className='ivo-ta';ta.placeholder=T('Votre réflexion…');
        state.vnotes=state.vnotes||{};state.vnotes[b.id]=state.vnotes[b.id]||{};
        ta.value=state.vnotes[b.id][st.t]||'';
        ta.oninput=function(){state.vnotes[b.id][st.t]=ta.value;persist();};
        card.appendChild(ta);
        var cont=document.createElement('button');cont.className='ivo-cont';cont.textContent=T('Continuer');
        cont.onclick=function(){overlay.style.display='none';resume();};
        card.appendChild(cont);
      }
      overlay.appendChild(card);
    }

    if(isFile){
      var vid=document.createElement('video');vid.className='ivideo-el';vid.controls=true;vid.src=b.url;vid.playsInline=true;
      stage.appendChild(vid);
      var lastCheck=-1;
      vid.addEventListener('timeupdate',function(){
        var tt=vid.currentTime;
        for(var i=0;i<stops.length;i++){
          var st=stops[i];var target=+st.t||0;
          if(!done[i]&&tt>=target&&tt<target+1.2){
            done[i]=true;vid.pause();
            showStop(st,function(){try{vid.play();}catch(e){}});
            break;
          }
        }
      });
      // empêcher de sauter un arrêt bloquant en avançant la barre
      vid.addEventListener('seeked',function(){
        for(var i=0;i<stops.length;i++){if(vid.currentTime>(+stops[i].t||0)+1.2)done[i]=done[i]||false;}
      });
    } else if(yt){
      var ph=document.createElement('div');ph.className='ivideo-ytwrap';
      var frameId='ytf_'+b.id;
      ph.innerHTML='<div id="'+frameId+'" class="ivideo-yt"></div>';
      stage.appendChild(ph);
      var player=null,poll=null;
      function startPoll(){
        if(poll)clearInterval(poll);
        poll=setInterval(function(){
          if(!player||!player.getCurrentTime)return;
          var tt=player.getCurrentTime();
          for(var i=0;i<stops.length;i++){var st=stops[i];var target=+st.t||0;
            if(!done[i]&&tt>=target&&tt<target+1.4){done[i]=true;player.pauseVideo();
              showStop(st,function(){try{player.playVideo();}catch(e){}});break;}}
        },400);
      }
      function makePlayer(){
        player=new YT.Player(frameId,{videoId:yt[1],playerVars:{rel:0,modestbranding:1},
          events:{onReady:startPoll}});
      }
      if(window.YT&&window.YT.Player){makePlayer();}
      else{
        if(!document.getElementById('yt-api')){var tag=document.createElement('script');tag.id='yt-api';tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);}
        var prev=window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady=function(){if(prev)prev();makePlayer();};
        // repli si l'API ne charge pas (hors-ligne)
        setTimeout(function(){if(!player){ph.innerHTML=videoEmbed(b.url,'');
          var warn=document.createElement('p');warn.className='ivideo-warn';warn.textContent=T('Les arrêts nécessitent une connexion à YouTube. La vidéo est affichée sans arrêts.');wrap.insertBefore(warn,stage.nextSibling);}},4000);
      }
    } else {
      // autre source : pas de contrôle possible
      stage.innerHTML=videoEmbed(b.url,'');
      var warn=document.createElement('p');warn.className='ivideo-warn';warn.textContent=T('Cette source ne permet pas les arrêts. Utilisez un fichier MP4 ou une vidéo YouTube.');
      wrap.insertBefore(warn,stage.nextSibling);
    }
    return wrap;
  }

  function buildSwipe(b){
    var isQuiz=b.type==='swipequiz';
    var wrap=document.createElement('div');wrap.className='swipe-block';
    var cards=(b.cards||[]).filter(function(c){return c.text&&c.text.trim();});
    var rec=state.swipe&&state.swipe[b.id];
    if(!rec){rec={done:{},idx:0,good:0,kept:[]};}
    var head=document.createElement('div');head.className='swipe-head';
    head.innerHTML=(b.prompt?'<p class="swipe-prompt">'+E(b.prompt)+'</p>':'')+
      '<div class="swipe-legend"><span class="sl-left">\u2190 '+E(b.leftLabel||(isQuiz?T('À éviter'):T('Écarter')))+'</span><span class="sl-right">'+E(b.rightLabel||(isQuiz?T('À faire'):T('Garder')))+' \u2192</span></div>';
    wrap.appendChild(head);
    var stage=document.createElement('div');stage.className='swipe-stage';wrap.appendChild(stage);
    var fb=document.createElement('div');fb.className='swipe-feedback';fb.setAttribute('aria-live','polite');wrap.appendChild(fb);
    var ctr=document.createElement('div');ctr.className='swipe-controls';
    var bNo=document.createElement('button');bNo.className='swipe-btn no';bNo.setAttribute('aria-label',E(b.leftLabel||(isQuiz?T('À éviter'):T('Écarter'))));bNo.innerHTML='<svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    var bYes=document.createElement('button');bYes.className='swipe-btn yes';bYes.setAttribute('aria-label',E(b.rightLabel||(isQuiz?T('À faire'):T('Garder'))));bYes.innerHTML='<svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';
    ctr.appendChild(bNo);ctr.appendChild(bYes);wrap.appendChild(ctr);
    var progress=document.createElement('div');progress.className='swipe-progress';wrap.appendChild(progress);

    function save(){state.swipe=state.swipe||{};state.swipe[b.id]=rec;persist();}
    function renderProgress(){progress.textContent=(rec.idx)+' / '+cards.length;}
    function finish(){
      stage.innerHTML='';
      /* la scene a une hauteur fixe pour la pile de cartes : une fois le tri
         termine, le recapitulatif peut etre long, on libere la hauteur
         pour qu'il ne chevauche pas le contenu suivant. */
      stage.classList.add('is-done');
      var sum=document.createElement('div');sum.className='swipe-done';
      if(isQuiz){
        sum.innerHTML='<div class="sd-ico">\u2713</div><div class="sd-txt">'+T('Terminé')+' \u2014 '+rec.good+' / '+cards.length+'</div>';
        state.quiz=state.quiz||{};state.quiz[b.id]={correct:rec.good===cards.length,score:rec.good,total:cards.length};persist();
        try{reportScore();maybeComplete();onQuizAnswered();}catch(e){}
      } else {
        var keptTxt=rec.kept.length?('<ul class="sd-kept">'+rec.kept.map(function(t){return '<li>'+E(t)+'</li>';}).join('')+'</ul>'):('<p class="sd-empty">'+T('Aucune carte gardée.')+'</p>');
        sum.innerHTML='<div class="sd-txt">'+T('Cartes gardées')+' ('+rec.kept.length+') \u2014 '+T('ajoutées à vos notes')+'</div>'+keptTxt;
      }
      var again=document.createElement('button');again.className='swipe-again';again.textContent=T('Recommencer');
      again.onclick=function(){rec={done:{},idx:0,good:0,kept:[]};if(!isQuiz&&state.quiz)delete state.quiz[b.id];save();draw();};
      sum.appendChild(again);
      stage.appendChild(sum);ctr.style.display='none';fb.textContent='';renderProgress();
    }
    function decide(card,right){
      rec.idx++;
      if(isQuiz){
        var ok=(!!card.good)===right;
        if(ok)rec.good++;
        fb.className='swipe-feedback '+(ok?'ok':'bad');
        fb.textContent=ok?T('Correct !'):T('À revoir.');
      } else {
        if(right)rec.kept.push(card.text);
        fb.className='swipe-feedback';fb.textContent='';
      }
      save();
      setTimeout(function(){if(rec.idx>=cards.length)finish();else draw();},isQuiz?520:180);
    }
    function draw(){
      stage.innerHTML='';ctr.style.display='';
      stage.classList.remove('is-done');
      renderProgress();
      if(rec.idx>=cards.length){finish();return;}
      // pile : carte courante + une ou deux dessous pour l'effet de profondeur.
      // Seule la carte du dessus montre son texte ; les autres restent vierges
      // pour ne pas laisser transparaître le contenu des cartes suivantes.
      for(var k=Math.min(rec.idx+2,cards.length-1);k>=rec.idx;k--){
        var card=cards[k];
        var el=document.createElement('div');el.className='swipe-card';
        el.style.zIndex=String(100-(k-rec.idx));
        el.style.transform='translateY('+((k-rec.idx)*8)+'px) scale('+(1-(k-rec.idx)*0.03)+')';
        if(k===rec.idx){
          el.innerHTML='<div class="sc-text">'+E(card.text)+'</div>';
          el.classList.add('is-top');wireDrag(el,card);
        } else {
          // carte de fond : pas de texte, juste la silhouette
          el.classList.add('is-behind');
        }
        stage.appendChild(el);
      }
    }
    function wireDrag(el,card){
      var sx=0,sy=0,dx=0,dragging=false;
      var hintL=document.createElement('span');hintL.className='sc-stamp stamp-no';hintL.textContent=(b.leftLabel||(isQuiz?T('À éviter'):T('Écarter')));
      var hintR=document.createElement('span');hintR.className='sc-stamp stamp-yes';hintR.textContent=(b.rightLabel||(isQuiz?T('À faire'):T('Garder')));
      el.appendChild(hintL);el.appendChild(hintR);
      function down(x,y){dragging=true;sx=x;sy=y;el.style.transition='none';}
      function move(x){if(!dragging)return;dx=x-sx;var rot=dx/18;
        el.style.transform='translateX('+dx+'px) rotate('+rot+'deg)';
        var op=Math.min(Math.abs(dx)/120,1);
        hintR.style.opacity=dx>0?op:0;hintL.style.opacity=dx<0?op:0;}
      function up(){if(!dragging)return;dragging=false;el.style.transition='';
        if(Math.abs(dx)>90){fly(dx>0);}else{el.style.transform='';hintR.style.opacity=0;hintL.style.opacity=0;}dx=0;}
      function fly(right){
        el.style.transform='translateX('+(right?1:-1)*window.innerWidth+'px) rotate('+(right?24:-24)+'deg)';
        el.style.opacity='0';
        setTimeout(function(){decide(card,right);},180);
      }
      el.__fly=fly;
      el.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);});
      window.addEventListener('mousemove',function(e){move(e.clientX);});
      window.addEventListener('mouseup',up);
      el.addEventListener('touchstart',function(e){var t=e.touches[0];down(t.clientX,t.clientY);},{passive:true});
      el.addEventListener('touchmove',function(e){var t=e.touches[0];move(t.clientX);},{passive:true});
      el.addEventListener('touchend',up);
    }
    bNo.onclick=function(){var top=stage.querySelector('.swipe-card.is-top');if(top&&top.__fly)top.__fly(false);else decide(cards[rec.idx],false);};
    bYes.onclick=function(){var top=stage.querySelector('.swipe-card.is-top');if(top&&top.__fly)top.__fly(true);else decide(cards[rec.idx],true);};
    if(!cards.length){wrap.innerHTML='<p class="swipe-empty">'+T('Aucune carte définie.')+'</p>';return wrap;}
    draw();
    return wrap;
  }

  function applyBgMusic(l){
    var au=document.getElementById('bgMusic'),btn=document.getElementById('bgMusicBtn');
    if(!l||!l.music){if(au){try{au.pause();}catch(e){}au.removeAttribute('src');au.remove();}if(btn)btn.remove();return;}
    if(!au){au=document.createElement('audio');au.id='bgMusic';document.body.appendChild(au);}
    if(au.getAttribute('data-src')!==l.music){try{au.pause();}catch(e){}au.setAttribute('data-src',l.music);au.src=l.music;try{au.currentTime=0;}catch(e){}}
    au.loop=(l.musicLoop!==false);au.volume=0.35;
    if(!btn){btn=document.createElement('button');btn.id='bgMusicBtn';btn.className='bgm-btn pulse';fabStack().insertBefore(btn,fabStack().firstChild);btn.onclick=function(){btn.classList.remove('pulse');state.musicOff=!state.musicOff;try{persist();}catch(e){}upd();};}
    function upd(){
      if(state.musicOff){try{au.pause();}catch(e){}btn.innerHTML='\u266A '+T('Musique coupée');btn.classList.add('off');}
      else{var pr=au.play();if(pr&&pr.catch)pr.catch(function(){});btn.innerHTML='\u25B6 '+T('Écouter la musique');btn.classList.remove('off');}
    }
    if(C.settings.askMusic&&!state.musicAsked){
      // rien ne doit démarrer tant que l'apprenant n'a pas répondu
      try{au.pause();}catch(e){}
      btn.innerHTML='\u266A '+T('Musique');btn.classList.add('off');
      // on attend que la demande de prénom soit passée pour ne pas empiler deux fenêtres
      if(C.settings.askName&&!(state.learnerName||'').trim())return;

      mp.querySelector('.mp-yes').onclick=function(){answer(false);};
      mp.querySelector('.mp-no').onclick=function(){answer(true);};

  // ---- Collecte des notes de l'apprenant ----
  function collectNotes(only){
    const excl=C.settings.notesExclude||[];
    const out={refl:[],pits:[],hl:[],any:false};
    lessons.forEach(function(o){
      o.l.blocks.forEach(function(b){
        if(b.type==='reflect'&&excl.indexOf(b.id)<0&&(!only||only.indexOf(b.id)>=0)){
          const v=state.notes[b.id]||'';
          out.refl.push({q:b.prompt||T('Réflexion'),v:v,les:o.l.title});
          if(v.trim())out.any=true;
        }
        if(b.type==='postit'&&(!only||only.indexOf(b.id)>=0)){
          const arr=((state.postits||{})[b.id]||[]).filter(function(x){return x.t&&x.t.trim();});
          if(arr.length){out.pits.push({q:b.prompt||'Post-its',items:arr,les:o.l.title});out.any=true;}
        }
        if(b.type==='swipesort'&&(!only||only.indexOf(b.id)>=0)){
          const rec=(state.swipe||{})[b.id];
          if(rec&&rec.kept&&rec.kept.length){out.pits.push({q:b.prompt||T('Cartes gardées'),items:rec.kept.map(function(t){return {t:t};}),les:o.l.title});out.any=true;}
        }
        if(PSB_R[b.type]&&(!only||only.indexOf(b.id)>=0)&&excl.indexOf(b.id)<0){
          var _pn=(state.psbNotes||{})[b.id]||[];
          _pn.forEach(function(x){if(x&&x.v&&String(x.v).trim()){out.refl.push({q:x.q||b.type,v:x.v,les:o.l.title});out.any=true;}});
        }
        if(b.type==='videoreflect'&&(!only||only.indexOf(b.id)>=0)){
          const vn=(state.vnotes||{})[b.id]||{};
          (b.stops||[]).forEach(function(st){const v=vn[st.t];if(v&&v.trim()){out.refl.push({q:(st.q||T('Réflexion'))+' ('+(st.t||0)+'s)',v:v,les:o.l.title});out.any=true;}});
        }
        if(b.type==='selfradar'&&(!only||only.indexOf(b.id)>=0)){
          const rd=(state.radars||{})[b.id];
          const ax=(b.axes||[]).filter(function(a){return a&&a.label;});
          if(rd&&rd.v&&ax.length>=3&&Object.keys(rd.v).some(function(k){return rd.v[k]>0;})){
            const mx=b.max||5;
            const items=ax.map(function(a){return {t:a.label+' : '+((rd.v[a.id]==null)?0:rd.v[a.id])+'/'+mx};});
            var rsvg='';try{rsvg=radarSVG(b,ax.map(function(a){return rd.v[a.id]||0;}),true);}catch(e){}
            out.pits.push({q:b.prompt||T('Radar d\'autoévaluation'),items:items,svg:rsvg,radar:true,les:o.l.title});out.any=true;
          }
        }
        if(b.type==='mindmapreflect'&&(!only||only.indexOf(b.id)>=0)){
          const mm=(state.mmaps||{})[b.id];
          if(mm&&((mm.center&&mm.center.trim())||(mm.nodes||[]).some(function(nd){return nd.label&&nd.label.trim();}))){
            const branches=[];
            (mm.nodes||[]).forEach(function(nd){
              if(nd.label&&nd.label.trim()){branches.push({t:nd.label});
                (nd.children||[]).forEach(function(kd){if(kd.label&&kd.label.trim())branches.push({t:'   ↳ '+kd.label});});
              }
            });
            var snap='';try{snap=mmSnapshotSVG(mm,b);}catch(e){}
            out.pits.push({q:(b.prompt||T('Carte mentale'))+(mm.center?' — '+mm.center:''),items:branches,svg:snap,les:o.l.title});out.any=true;
          }
        }
      });
    });
    if(!only||only.indexOf('__hl')>=0){
      lessons.forEach(function(o){
        const arr=(state.hl||{})[o.l.id]||[];
        if(arr.length){out.hl.push({les:o.l.title,items:arr});out.any=true;}
      });
    }
    // captures localisées ajoutées par l'apprenant
    out.caps=[];
    if(!only||only.indexOf('__hl')>=0){
      lessons.forEach(function(o){
        const arr=(state.caps||{})[o.l.id]||[];
        if(arr.length){out.caps.push({les:o.l.title,items:arr});out.any=true;}
      });
    }
    return out;
  }
  function notesFileName(){return (C.meta.title||'notes').replace(/\W+/g,'_')+'_notes';}
  // ---- Version texte ----
  function notesTxt(only,label){
    const d=collectNotes(only);
    let t=(C.meta.title||T('Cours'))+'\n'+'='.repeat((C.meta.title||T('Cours')).length)+'\n\n'+(label||T('Mes notes'))+'\n\n';
    d.refl.forEach(function(r){t+='● '+r.q+'\n'+(r.v&&r.v.trim()?r.v:'('+T('pas de note')+')')+'\n\n';});
    d.pits.forEach(function(pp){t+='● '+pp.q+'\n';pp.items.forEach(function(x){t+='  – '+x.t.trim()+'\n';});t+='\n';});
    if(d.hl.length){t+=T('Passages surlignés')+'\n\n';d.hl.forEach(function(h){t+='● '+h.les+'\n';h.items.forEach(function(x){t+='  ▸ '+x.t+'\n';});t+='\n';});}
    if(d.caps&&d.caps.length){t+=T('Passages captés')+'\n\n';d.caps.forEach(function(h){t+='● '+h.les+'\n';h.items.forEach(function(x){t+='  ▸ '+x.t+'\n';});t+='\n';});}
    t+='\n— '+T('Généré le')+' '+new Date().toLocaleDateString(LANG==='en'?'en-GB':'fr-FR');
    return t;
  }

  /* ---- notes éditables : on aplatit tout en une liste d'items réordonnables ---- */
  var _noteItems=null;
  function notesToItems(only){
    const d=collectNotes(only);
    const items=[];
    let n=0;
    const id=()=>'ni'+(++n);
    d.refl.forEach(function(r){
      items.push({id:id(),kind:'refl',title:r.q||T('Réflexion'),body:(r.v||'').trim(),src:r.les||''});
    });
    d.pits.forEach(function(pp){
      const lignes=(pp.items||[]).map(function(x){return x.t.trim();}).filter(Boolean);
      items.push({id:id(),kind:'pit',title:pp.q||T('Idées'),body:lignes.join('\n'),svg:pp.svg||'',radar:!!pp.radar,src:pp.les||''});
    });
    d.hl.forEach(function(g){
      (g.items||[]).forEach(function(x){
        items.push({id:id(),kind:'hl',title:T('Surligné'),body:x.t||'',color:x.c||'#ffe066',src:g.les||''});

    (d.caps||[]).forEach(function(g){

        if(x.html){items.push({id:id(),kind:'cap',title:T('Visuel capté'),snapHtml:x.html,src:g.les||''});}
        else{items.push({id:id(),kind:'cap',title:T('Passage capté'),body:x.t||'',src:g.les||''});}
      });

  // rendu du corps d'une note : HTML riche assaini, ou texte brut échappé
  function sanitizeRich(html){
    if(!html)return '';
    const box=document.createElement('div');box.innerHTML=html;
    const allow={B:1,STRONG:1,I:1,EM:1,U:1,MARK:1,BR:1,UL:1,OL:1,LI:1,P:1,DIV:1,SPAN:1};
    (function walk(node){
      const kids=Array.prototype.slice.call(node.childNodes);
      kids.forEach(function(n){
        if(n.nodeType===1){
          if(!allow[n.tagName]){
            // remplacer une balise interdite par son contenu
            while(n.firstChild)node.insertBefore(n.firstChild,n);
            node.removeChild(n);return;
          }
          // ne garder que le style de surlignage sur mark/span
          const keep=n.getAttribute('data-hl')||'';
          for(let i=n.attributes.length-1;i>=0;i--){const a=n.attributes[i].name;if(a!=='style')n.removeAttribute(a);}
          const st=n.getAttribute('style')||'';
          const bg=/background(?:-color)?:\s*([^;]+)/i.exec(st);
          if(bg&&(n.tagName==='MARK'||n.tagName==='SPAN'))n.setAttribute('style','background:'+bg[1].trim());
          else n.removeAttribute('style');
          walk(n);
        } else if(n.nodeType===8){node.removeChild(n);}
      });
    })(box);
    return box.innerHTML;
  }
  function bodyHTML(it){
    if(it.rich!=null&&String(it.rich).trim())return sanitizeRich(it.rich);
    return E(it.body||'').replace(/\n/g,'<br>');
  }

      else if(it.rich!=null||it.body!=null){h+='<div class="np-a'+((it.rich||it.body||'').trim?((it.rich||it.body).trim()?'':' np-none'):'')+'">'+((it.rich||(it.body||'').trim())?bodyHTML(it):T('Pas de note'))+'</div>';}

  function richToText(html){
    if(!html)return '';
    const box=document.createElement('div');box.innerHTML=html;
    box.querySelectorAll('li').forEach(function(li){li.textContent='• '+li.textContent;});
    box.querySelectorAll('br').forEach(function(br){br.replaceWith('\n');});
    box.querySelectorAll('p,div,li,ul,ol').forEach(function(el){el.insertAdjacentText('afterend','\n');});
    return (box.innerText||box.textContent||'').replace(/\n{3,}/g,'\n\n').trim();

        inner.appendChild(rendered);inner.appendChild(guard);
        if(b.altFor){
          const ac=document.createElement('span');ac.className='eb-alt';ac.setAttribute('aria-hidden','true');
          ac.textContent='♿ Version accessible';
          ac.title=TU('Ce bloc remplace le bloc précédent quand l\'apprenant active la version accessible.');
          slot.appendChild(ac);slot.classList.add('eb-altblk');
        }
        const fv=(window.__FB__||{})[b.id];
        if(fv){
          const fc2=document.createElement('span');
          fc2.className='eb-fb'+(fv.todo?'':' done');
          fc2.setAttribute('aria-hidden','true');
          fc2.textContent=(fv.todo?'💬 '+fv.todo:'✅ '+fv.n);
          fc2.title=fv.todo?fv.todo+' '+TU('retour(s) de relecture à traiter'):TU('Tous les retours sont traités');
          slot.appendChild(fc2);
        }
        const av=(window.__A11Y__||{})[b.id];
        if(av){
          const chip=document.createElement('span');
          chip.className='eb-a11y '+av.lv;
          chip.setAttribute('aria-hidden','true');
          chip.textContent=(av.lv==='err'?'⛔':'⚠️')+' '+av.n;
          chip.title=(C.__uilang==='en')
            ? (av.n+(av.lv==='err'?(' blocking accessibility point'+(av.n>1?'s':'')):(' accessibility point'+(av.n>1?'s':'')+' to check'))+' — click the block for details')
            : ((av.lv==='err'?(av.n+' '+TU('point(s) bloquant(s) pour l\'accessibilité')):(av.n+' '+TU('point(s) d\'accessibilité à vérifier')))+' — '+TU('cliquez sur le bloc pour le détail'));
          slot.appendChild(chip);
        }
        const tools=document.createElement('div');tools.className='eb-tools';
        tools.innerHTML='<span class="eb-label">'+E((C.__labels&&C.__labels[b.type])||b.type)+'</span>'+
          ((b.type==='text'||b.type==='textgroup')?'<button data-a="morph" title="'+((C.__uilang==='en')?'Change text layout':'Changer la disposition du texte')+'">&#8635;</button>':'')+
          '<button data-a="up" title="Monter">&#9650;</button>'+
          '<button data-a="down" title="Descendre">&#9660;</button>'+
          '<button data-a="dup" title="Dupliquer">&#10697;</button>'+
          '<button data-a="del" title="Supprimer">&#10005;</button>';
        const ins=document.createElement('button');ins.className='eb-ins';ins.title=((C.__uilang==='en')?'Insert a block here':'Insérer un bloc ici');
        ins.innerHTML='<span>+</span>';
        ins.onclick=e=>{e.stopPropagation();post('insert',{idx:idx});};
        slot.appendChild(ins);
        slot.appendChild(tools);slot.appendChild(inner);
        slot.addEventListener('click',e=>{if(e.target.closest('.eb-tools'))return;post('select',{id:b.id});});
        tools.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();post('action',{id:b.id,act:btn.dataset.a});}));
        slot.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',idx);slot.classList.add('dragging');});
        slot.addEventListener('dragend',()=>slot.classList.remove('dragging'));
        slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drop-target');});
        slot.addEventListener('dragleave',()=>slot.classList.remove('drop-target'));
        slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drop-target');const from=+e.dataTransfer.getData('text/plain');if(from!==idx)post('move',{from:from,to:idx});});
        return slot;
       }catch(__e){
        const slot=document.createElement('div');slot.className='eb-slot'+(b.id===selId?' sel':'');slot.dataset.bid=b.id;slot.dataset.idx=idx;slot.draggable=true;
        let rendered;try{rendered=renderBlock(b);}catch(e){rendered=document.createElement('div');rendered.className='b';rendered.textContent='[Erreur de rendu]';}
        const inner=document.createElement('div');inner.className='eb-inner';inner.appendChild(rendered);
        const tools=document.createElement('div');tools.className='eb-tools';
        tools.innerHTML='<span class="eb-label">'+E((C.__labels&&C.__labels[b.type])||b.type)+'</span>'+((b.type==='text'||b.type==='textgroup')?'<button data-a="morph" title="'+((C.__uilang==='en')?'Change text layout':'Changer la disposition du texte')+'">\u21BB</button>':'')+'<button data-a="up" title="'+((C.__uilang==='en')?'Move up':'Monter')+'">\u25B2</button><button data-a="down" title="'+((C.__uilang==='en')?'Move down':'Descendre')+'">\u25BC</button><button data-a="dup" title="'+((C.__uilang==='en')?'Duplicate':'Dupliquer')+'">\u29C9</button><button data-a="del" title="'+((C.__uilang==='en')?'Delete':'Supprimer')+'">\u2715</button>';
        const ins=document.createElement('button');ins.className='eb-ins';ins.title=((C.__uilang==='en')?'Insert a block here':'Insérer un bloc ici');ins.innerHTML='<span>+</span>';ins.onclick=e=>{e.stopPropagation();post('insert',{idx:idx});};
        slot.appendChild(ins);slot.appendChild(tools);slot.appendChild(inner);
        slot.addEventListener('click',e=>{if(e.target.closest('.eb-tools'))return;post('select',{id:b.id});});
        tools.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();post('action',{id:b.id,act:btn.dataset.a});}));
        slot.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',idx);slot.classList.add('dragging');});
        slot.addEventListener('dragend',()=>slot.classList.remove('dragging'));
        slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drop-target');});
        slot.addEventListener('dragleave',()=>slot.classList.remove('drop-target'));
        slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drop-target');const from=+e.dataTransfer.getData('text/plain');if(from!==idx)post('move',{from:from,to:idx});});
        return slot;
       }
      });
    }
    const addSec=document.createElement('div');addSec.className='sec';
    const addIn=document.createElement('div');addIn.className='sec-in';addSec.appendChild(addIn);wrap.appendChild(addSec);
    const add=document.createElement('button');add.className='eb-add';add.innerHTML='<span>+</span> '+((C.__uilang==='en')?'Add a block':'Ajouter un bloc');
    add.onclick=()=>post('add',{});
    addIn.appendChild(add);
  }
  function post(type,data){try{parent.postMessage(Object.assign({__edit:true,type:type},data),'*');}catch(e){}}

  /* ============ DÉMARRAGE ============ */
  buildShell();
  let start=(typeof window.__START__==='number')?window.__START__:(state.idx||0);if(start>=lessons.length||start<0)start=0;
  // si verrouillé, revenir à la première non terminée
  if(lessonState(start)==='locked'){start=lessons.findIndex((_,i)=>lessonState(i)!=='locked');if(start<0)start=0;}
  try{pageUnlockInit();}catch(e){}
  renderLesson(start);
  if(typeof window.__START__!=='number'&&C.home&&C.home.enabled&&C.home.blocks&&C.home.blocks.length){try{showHomeScreen();}catch(e){}}
  if(C.settings.askName&&!(state.learnerName||'').trim()){try{showNameGate();}catch(e){}}
  window.addEventListener('beforeunload',()=>{persist();SCORM.finish();});
})();</script></body></html>
